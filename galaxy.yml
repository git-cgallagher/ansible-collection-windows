namespace: git_cgallagher
name: windows
version: 0.7.0
readme: README.md
authors:
  - Chris Gallagher (@git-cgallagher)
description: >-
  Windows Server automation: Group Policy as code (export domain GPOs with
  their links, precedence, filtering and WMI filters to Git, and import them
  into a target domain), failover clusters for file servers, SQL Server FCIs
  and availability groups, and IIS MIME type mappings.
license:
  - MIT
tags:
  - windows
  - gpo
  - grouppolicy
  - activedirectory
  - wsfc
  - failovercluster
  - sqlserver
  - iac
  - iis
dependencies:
  ansible.windows: '>=2.0.0'
repository: https://github.com/git-cgallagher/ansible-collection-windows
documentation: https://github.com/git-cgallagher/ansible-collection-windows#readme
issues: https://github.com/git-cgallagher/ansible-collection-windows/issues
build_ignore:
  - .github
  - .ansible
  - collections
  - .config
  - roles/*/molecule
  - .molecule-collections
  - tests
  - '*.tar.gz'
  - .ansible-lint
  - .ansible-lint-ignore
  - .yamllint
  - .gitignore
  - AGENTS.md

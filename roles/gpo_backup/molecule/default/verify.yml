---
# The role's behaviour: what it fetched and unpacked into the repo, its check
# mode (the fetch and unpack skipped, the repo untouched) and a re-export of a
# changed GPO landing in the repo. The module's own behaviour (the manifest's
# content, the preflight, the working directory, the gpo_names filter, the
# failures) is the gpo_export integration target, which the last play runs.
- name: Verify the export against the seeded domain
  hosts: all
  gather_facts: false
  vars:
    lab_repo: "{{ lab_dir }}/gpo-repo"
    lab_fixture_gpos: "{{ [lab_fixture.gpo_baseline, lab_fixture.gpo_rdp, lab_fixture.gpo_password,
                           lab_fixture.gpo_server_admins, lab_fixture.gpo_ws_admins] }}"
  tasks:
    # 1. What converge fetched and unpacked, against the fixture.
    - name: Check the manifest reached the repo with every fixture GPO in it
      ansible.builtin.assert:
        that:
          - lab_m.domain == lab_domain
          - lab_fixture_gpos | difference(lab_m.gpos.keys() | list) == []
        fail_msg: "Manifest in the repo: {{ lab_m | to_nice_json }}"
      vars:
        lab_m: "{{ lookup('ansible.builtin.file', lab_repo ~ '/gpo-manifest.json') | from_json }}"

    - name: Check every fixture GPO was unpacked as a backup folder
      ansible.builtin.stat:
        path: "{{ lab_repo }}/gpos/{{ item }}/manifest.xml"
      loop: "{{ lab_fixture_gpos }}"
      register: lab_backup_folders
      failed_when: not lab_backup_folders.stat.exists
      delegate_to: localhost

    - name: List the RDP GPO's backup folders in the repo
      ansible.builtin.find:
        paths: "{{ lab_repo }}/gpos/{{ lab_fixture.gpo_rdp }}"
        file_type: directory
        patterns: ['{*}']
      register: lab_rdp_before
      delegate_to: localhost

    # 2. Positive change detection, end to end. The idempotence step showed an
    #    unchanged domain ships nothing; a real settings change has to ship
    #    that GPO, and the role has to replace its folder in the repo.
    - name: Change a setting in the RDP GPO through GPMC (a new value on every run)
      ansible.windows.win_powershell:
        script: |
          param([string]$Domain, [string]$Name)
          $pdc = (Get-ADDomain -Identity $Domain).PDCEmulator
          $value = [int]((Get-Date).ToUniversalTime() - [datetime]'2026-01-01').TotalSeconds
          Set-GPRegistryValue -Name $Name -Domain $Domain -Server $pdc `
              -Key 'HKLM\Software\Policies\GpoIacLab' -ValueName 'BackupProbe' -Type DWord -Value $value | Out-Null
          $Ansible.Result = $value
        parameters:
          Domain: "{{ lab_domain }}"
          Name: "{{ lab_fixture.gpo_rdp }}"

    # 3. The role in check mode: the module predicts the changed GPO and writes
    #    no zip, so the fetch and unpack are skipped and the repo is untouched.
    - name: Snapshot the repo before the check-mode run
      ansible.builtin.find:
        paths: "{{ lab_repo }}"
        recurse: true
      register: lab_repo_before
      delegate_to: localhost

    - name: Export the changed domain in check mode
      ansible.builtin.include_role:
        name: git_cgallagher.windows.gpo_backup
        apply:
          check_mode: true
      vars:
        gpo_backup_domain: "{{ lab_domain }}"
        gpo_backup_repo_dir: "{{ lab_repo }}"

    - name: Snapshot the repo after the check-mode run
      ansible.builtin.find:
        paths: "{{ lab_repo }}"
        recurse: true
      register: lab_repo_after
      delegate_to: localhost

    - name: Check that check mode predicted the changed GPO and left the repo alone
      ansible.builtin.assert:
        that:
          - gpo_backup_export.changed
          - gpo_backup_export.shipped | map(attribute='name') | list == [lab_fixture.gpo_rdp]
          - gpo_backup_export.zip is none
          - gpo_backup_tmp is skipped
          - lab_repo_before.files | map(attribute='path') | sort == lab_repo_after.files | map(attribute='path') | sort
          - lab_repo_before.files | map(attribute='mtime') | sort == lab_repo_after.files | map(attribute='mtime') | sort
        fail_msg: >-
          Check mode should predict exactly {{ lab_fixture.gpo_rdp }} and leave the repo alone:
          {{ gpo_backup_export | to_nice_json }}

    - name: Remember the check-mode plan
      ansible.builtin.set_fact:
        lab_check_plan: "{{ gpo_backup_export.shipped | map(attribute='name') | list }}"

    - name: Export the changed domain
      ansible.builtin.include_role:
        name: git_cgallagher.windows.gpo_backup
      vars:
        gpo_backup_domain: "{{ lab_domain }}"
        gpo_backup_repo_dir: "{{ lab_repo }}"

    - name: List the RDP GPO's backup folders in the repo after the re-export
      ansible.builtin.find:
        paths: "{{ lab_repo }}/gpos/{{ lab_fixture.gpo_rdp }}"
        file_type: directory
        patterns: ['{*}']
      register: lab_rdp_after
      delegate_to: localhost

    # A re-backup gets a fresh {backup-guid} folder; the role replaces the
    # GPO's folder in the repo rather than leaving the old one next to it.
    - name: Check the changed GPO, and only it, was fetched and its folder replaced
      ansible.builtin.assert:
        that:
          - gpo_backup_export.changed
          - gpo_backup_export.shipped | map(attribute='name') | list == lab_check_plan
          - gpo_backup_export.zip is not none
          - lab_rdp_before.files | length == 1
          - lab_rdp_after.files | length == 1
          - lab_rdp_after.files[0].path != lab_rdp_before.files[0].path
        fail_msg: >-
          Expected exactly {{ lab_fixture.gpo_rdp }} to ship, as check mode planned, and its folder to be replaced:
          {{ gpo_backup_export | to_nice_json }}; before {{ lab_rdp_before.files | map(attribute='path') | list }},
          after {{ lab_rdp_after.files | map(attribute='path') | list }}

# 4. The module's own integration target, from tests/integration/targets
#    (ANSIBLE_ROLES_PATH in molecule.yml), with setup_gpo_lab: check mode,
#    the real export, the repeat, a changed GPO shipping alone, gpo_names and
#    the failures, in a working directory of its own that it removes.
- name: Run the gpo_export target
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the gpo_export target
      ansible.builtin.include_role:
        name: gpo_export

---
# gpo_backup's scenario: seed a real domain, export it, and check the export
# and its change detection (see README.md). The driver, platform,
# provisioner and inventory come from the repository's Molecule base
# config, .config/molecule/config.yml, which Molecule merges under this
# file.
scenario:
  name: default
provisioner:
  env:
    # verify.yml ends by running the gpo_export module's integration target
    # (tests/integration/targets/) as a role; setup_gpo_lab is its dependency.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../tests/integration/targets

---
# meta/argument_specs.yml makes Ansible check types and required variables
# before this runs; a spec can't express "non-empty", so check that here.
- name: Require a non-empty domain and repo directory
  ansible.builtin.assert:
    that:
      - gpo_backup_domain | default('') | length > 0
      - gpo_backup_repo_dir | default('') | length > 0
    fail_msg: gpo_backup_domain and gpo_backup_repo_dir must be non-empty
    quiet: true

# Read-only against AD and SYSVOL; writes only its working directory on the
# management host, and nothing at all in check mode, where it still computes
# what would ship.
- name: Export GPOs and topology manifest
  git_cgallagher.windows.gpo_export:
    domain: "{{ gpo_backup_domain }}"
    server: "{{ gpo_backup_server }}"
    work_dir: "{{ gpo_backup_workdir }}"
    gpo_names: "{{ gpo_backup_gpos }}"
    full_export: "{{ gpo_backup_full_export | bool }}"
  register: gpo_backup_export

- name: Report what changed
  ansible.builtin.debug:
    msg: >-
      {{ gpo_backup_export.gpo_count }} GPO(s) in {{ gpo_backup_domain }}:
      shipping {{ gpo_backup_export.shipped | length }},
      deleted {{ gpo_backup_export.deleted | length }},
      manifest changed: {{ gpo_backup_export.manifest_changed }}

# The zip is null when the module ran in check mode (nothing was written).
- name: Fetch and unpack the export on the controller
  when:
    - gpo_backup_export.changed | bool or gpo_backup_full_export | bool
    - gpo_backup_export.zip is not none
  block:
    - name: Create a controller-side staging directory
      ansible.builtin.tempfile:
        state: directory
        suffix: gpo-export
      register: gpo_backup_tmp
      delegate_to: localhost
      become: false

    - name: Fetch the export zip
      ansible.builtin.fetch:
        src: "{{ gpo_backup_export.zip }}"
        dest: "{{ gpo_backup_tmp.path }}/gpo-export.zip"
        flat: true

    - name: Ensure the repo gpos directory exists
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    # A re-backup gets a fresh {backup-guid} subfolder; the previous one must
    # not linger next to it in the repo.
    - name: Remove re-exported GPO folders before unpacking
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos/{{ item.backup_dir }}"
        state: absent
      loop: "{{ gpo_backup_export.shipped }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false

    - name: Unpack the export into the repo
      ansible.builtin.unarchive:
        src: "{{ gpo_backup_tmp.path }}/gpo-export.zip"
        dest: "{{ gpo_backup_repo_dir }}"
        remote_src: true
      delegate_to: localhost
      become: false

    - name: Prune folders of deleted GPOs
      ansible.builtin.file:
        path: "{{ gpo_backup_repo_dir }}/gpos/{{ item.backup_dir }}"
        state: absent
      loop: "{{ gpo_backup_export.deleted if gpo_backup_prune_deleted else [] }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false

    - name: Remove the controller staging directory
      ansible.builtin.file:
        path: "{{ gpo_backup_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false

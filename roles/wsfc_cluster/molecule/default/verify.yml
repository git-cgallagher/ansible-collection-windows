---
- name: Verify the cluster
  hosts: all
  gather_facts: false
  # The role's variables, shared by the plan and the fix below.
  vars:
    lab_role_vars: &lab_role_vars
      wsfc_cluster_name: "{{ lab_cluster.name }}"
      wsfc_cluster_administrative_access_point: None
      wsfc_cluster_validate_ignore: [Storage]
      wsfc_cluster_networks:
        - subnet: "{{ lab_cluster.subnet }}"
          name: "{{ lab_cluster.network_name }}"
          role: cluster
          metric: "{{ lab_cluster.metric }}"
      wsfc_cluster_properties:
        SameSubnetThreshold: "{{ lab_cluster.same_subnet_threshold }}"
        CrossSubnetThreshold: "{{ lab_cluster.cross_subnet_threshold }}"
      wsfc_cluster_quorum:
        type: node_majority
      wsfc_cluster_become_user: "{{ ansible_user }}"
      wsfc_cluster_become_password: "{{ ansible_password }}"
  tasks:
    # 1. What converge built, read straight from the cluster.
    - name: Read the cluster
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/cluster_state.ps1') }}"
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ ansible_user }}"
      vars:
        ansible_become_password: "{{ ansible_password }}"
      register: lab_state

    - name: Check the cluster matches the role's variables
      ansible.builtin.assert:
        that:
          - lab_c.name == lab_cluster.name
          - lab_c.nodes | map('upper') | list == [lab_c.computer | upper]
          - lab_c.node_states == ['Up']
          - lab_c.same_subnet_threshold == lab_cluster.same_subnet_threshold
          - lab_c.cross_subnet_threshold == lab_cluster.cross_subnet_threshold
          - lab_c.networks | length == 1
          - lab_c.networks[0].name == lab_cluster.network_name
          - lab_c.networks[0].role == 1
          - lab_c.networks[0].metric == lab_cluster.metric
          - not lab_c.witness
          # Administrative access point None: no cluster network name.
          - not lab_c.network_name_resource
        fail_msg: "Cluster state: {{ lab_c | to_nice_json }}"
      vars:
        lab_c: "{{ lab_state.result }}"

    # 2. Out-of-band drift: a report-only run plans the fix without making it.
    - name: Drift a cluster property out-of-band
      ansible.windows.win_powershell:
        script: |
          Import-Module FailoverClusters
          (Get-Cluster -Name $env:COMPUTERNAME).SameSubnetThreshold = 12
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ ansible_user }}"
      vars:
        ansible_become_password: "{{ ansible_password }}"

    - name: Plan with wsfc_cluster in report-only mode
      ansible.builtin.include_role:
        name: git_cgallagher.windows.wsfc_cluster
      vars:
        <<: *lab_role_vars
        wsfc_cluster_report_only: true

    - name: Check the plan has exactly the property fix
      ansible.builtin.assert:
        that:
          - wsfc_cluster_run.result.report_only
          - wsfc_cluster_run.result.actions | length == 1
          - wsfc_cluster_run.result.actions[0] is search('SameSubnetThreshold')
        fail_msg: "Plan: {{ wsfc_cluster_run.result }}"

    - name: Read the cluster after the plan
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/cluster_state.ps1') }}"
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ ansible_user }}"
      vars:
        ansible_become_password: "{{ ansible_password }}"
      register: lab_after_plan

    - name: Check report-only changed nothing
      ansible.builtin.assert:
        that: lab_after_plan.result.same_subnet_threshold == 12
        fail_msg: "Cluster state: {{ lab_after_plan.result | to_nice_json }}"

    # 3. A real run puts it back, and only that.
    - name: Converge again with wsfc_cluster
      ansible.builtin.include_role:
        name: git_cgallagher.windows.wsfc_cluster
      vars:
        <<: *lab_role_vars

    - name: Check the drift was fixed
      ansible.builtin.assert:
        that:
          - wsfc_cluster_run is changed
          - not wsfc_cluster_run.result.report_only
          - not wsfc_cluster_run.result.created
          - wsfc_cluster_run.result.actions | length == 1
        fail_msg: "Run: {{ wsfc_cluster_run.result }}"

    - name: Read the cluster after the fix
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/cluster_state.ps1') }}"
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ ansible_user }}"
      vars:
        ansible_become_password: "{{ ansible_password }}"
      register: lab_after_fix

    - name: Check the property is back
      ansible.builtin.assert:
        that: lab_after_fix.result.same_subnet_threshold == lab_cluster.same_subnet_threshold
        fail_msg: "Cluster state: {{ lab_after_fix.result | to_nice_json }}"

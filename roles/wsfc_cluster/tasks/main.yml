---
# meta/argument_specs.yml makes Ansible check types and required variables
# before this runs; a spec can't express these, so check them here.
- name: Require a usable cluster name and managing node
  ansible.builtin.assert:
    that:
      - wsfc_cluster_name | default('') | length > 0
      - wsfc_cluster_name | length <= 15
      - wsfc_cluster_manage_node | length == 0 or wsfc_cluster_manage_node in ansible_play_hosts_all
      - wsfc_cluster_quorum | length == 0 or wsfc_cluster_quorum.type | default('', true) | length > 0
    fail_msg: >-
      wsfc_cluster_name must be non-empty and at most 15 characters (a NetBIOS name),
      wsfc_cluster_manage_node, when set, must be a host in this play, and wsfc_cluster_quorum, when
      set, needs a type
    quiet: true

# --- every node ------------------------------------------------------------------
- name: Install Failover Clustering
  ansible.windows.win_feature:
    name: "{{ ['Failover-Clustering', 'RSAT-Clustering-PowerShell'] + wsfc_cluster_extra_features }}"
    include_management_tools: true
    state: present
  register: wsfc_cluster_features

- name: Refuse to reboot a node unasked
  ansible.builtin.fail:
    msg: >-
      The Failover Clustering feature install needs a reboot of {{ inventory_hostname }}. Reboot it, or set
      wsfc_cluster_allow_reboot: true.
  when:
    - wsfc_cluster_features.reboot_required | default(false)
    - not wsfc_cluster_allow_reboot | bool

- name: Reboot after the feature install
  ansible.windows.win_reboot:
    reboot_timeout: 1800
  when: wsfc_cluster_features.reboot_required | default(false)

# The cluster's node names are computer names, which needn't match inventory
# names; read them rather than guess. Read-only, so it runs in check mode too.
- name: Read the node's computer name
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $env:COMPUTERNAME
  register: wsfc_cluster_computer
  check_mode: false
  when: wsfc_cluster_nodes | length == 0

# --- once, on the managing node --------------------------------------------------
# New-Cluster has no -WhatIf worth trusting, so the script itself runs in check
# mode and maps it onto report-only (like gpo_import).
- name: Create or converge the cluster
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path ~ '/files/converge_cluster.ps1') }}"
    parameters:
      Name: "{{ wsfc_cluster_name }}"
      Nodes: "{{ wsfc_cluster_node_names }}"
      AdministrativeAccessPoint: "{{ wsfc_cluster_administrative_access_point }}"
      StaticAddresses: "{{ wsfc_cluster_static_addresses }}"
      IgnoreNetworks: "{{ wsfc_cluster_ignore_networks }}"
      Validate: "{{ wsfc_cluster_validate | bool }}"
      ValidateIgnore: "{{ wsfc_cluster_validate_ignore }}"
      ReportDir: "{{ wsfc_cluster_report_dir }}"
      QuorumJson: "{{ wsfc_cluster_quorum | to_json }}"
      NetworksJson: "{{ wsfc_cluster_networks | to_json }}"
      PropertiesJson: "{{ wsfc_cluster_properties | to_json }}"
      DisksJson: "{{ wsfc_cluster_disks | to_json }}"
      ReportOnly: "{{ wsfc_cluster_report_only | bool or ansible_check_mode }}"
  vars:
    wsfc_cluster_node_names: >-
      {{ wsfc_cluster_nodes if wsfc_cluster_nodes | length > 0 else
         ansible_play_hosts | map('extract', hostvars, ['wsfc_cluster_computer', 'output', 0]) | list }}
    ansible_become_password: "{{ wsfc_cluster_become_password }}"
  become: "{{ wsfc_cluster_become_user | length > 0 }}"
  become_method: ansible.builtin.runas
  become_user: "{{ wsfc_cluster_become_user }}"
  # The module arguments carry a cloud witness's access key.
  no_log: "{{ wsfc_cluster_quorum.access_key | default('') | length > 0 }}"
  delegate_to: "{{ wsfc_cluster_manage_node if wsfc_cluster_manage_node | length > 0 else ansible_play_hosts[0] }}"
  run_once: true
  register: wsfc_cluster_run
  check_mode: false

- name: Report actions and warnings
  ansible.builtin.debug:
    msg:
      - "report_only: {{ wsfc_cluster_run.result.report_only }}"
      - "actions: {{ wsfc_cluster_run.result.actions }}"
      - "warnings: {{ wsfc_cluster_run.result.warnings }}"
      - "validation report: {{ wsfc_cluster_run.result.validation_report }}"
  run_once: true

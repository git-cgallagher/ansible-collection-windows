---
# A workgroup server, not a DC: converge creates the cluster from nothing.
# Re-running prepare on the same VM (molecule prepare --force) removes a
# cluster a previous converge left.
- name: Prepare a workgroup node
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for the connection
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Quiet the VM (Windows Update off, Defender real-time scanning off)
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          }
          catch {
              $Ansible.Result = "Defender not changed: $($_.Exception.Message)"
          }

    # Microsoft's prerequisites for a workgroup cluster: a primary DNS suffix
    # on every node, and remote UAC filtering off for a local administrator
    # that isn't the built-in Administrator (the box's account is vagrant).
    - name: Set a primary DNS suffix
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
        name: NV Domain
        data: "{{ lab_cluster.dns_suffix }}"
        type: string
      notify: Reboot so the DNS suffix takes effect

    - name: Turn off remote UAC filtering for local administrators
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: LocalAccountTokenFilterPolicy
        data: 1
        type: dword

    - name: Reboot now if the DNS suffix changed
      ansible.builtin.meta: flush_handlers

    - name: Remove a cluster left by a previous converge
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          if (Get-Module -ListAvailable -Name FailoverClusters) {
              Import-Module FailoverClusters
              $cluster = $null
              try {
                  $cluster = Get-Cluster -Name $env:COMPUTERNAME -ErrorAction Stop
              }
              catch {
                  $cluster = $null
              }
              if ($null -ne $cluster) {
                  $cluster | Remove-Cluster -Force -CleanupAD:$false
                  $Ansible.Changed = $true
              }
          }
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ ansible_user }}"
      vars:
        ansible_become_password: "{{ ansible_password }}"

  handlers:
    - name: Reboot so the DNS suffix takes effect
      ansible.windows.win_reboot:
        reboot_timeout: 900

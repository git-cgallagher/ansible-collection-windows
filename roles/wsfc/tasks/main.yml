---
# meta/argument_specs.yml makes Ansible check types and required variables
# before this runs; a spec can't express these, so check them here.
- name: Require a usable cluster name and managing node
  ansible.builtin.assert:
    that:
      - wsfc_name | default('') | length > 0
      - wsfc_name | length <= 15
      - wsfc_manage_node | length == 0 or wsfc_manage_node in ansible_play_hosts_all
      - wsfc_quorum | length == 0 or wsfc_quorum.type | default('', true) | length > 0
    fail_msg: >-
      wsfc_name must be non-empty and at most 15 characters (a NetBIOS name),
      wsfc_manage_node, when set, must be a host in this play, and wsfc_quorum, when
      set, needs a type
    quiet: true

# --- every node ------------------------------------------------------------------
- name: Install Failover Clustering
  ansible.windows.win_feature:
    name: "{{ ['Failover-Clustering', 'RSAT-Clustering-PowerShell'] + wsfc_extra_features }}"
    include_management_tools: true
    state: present
  register: wsfc_features

- name: Refuse to reboot a node unasked
  ansible.builtin.fail:
    msg: >-
      The Failover Clustering feature install needs a reboot of {{ inventory_hostname }}. Reboot it, or set
      wsfc_allow_reboot: true.
  when:
    - wsfc_features.reboot_required | default(false)
    - not wsfc_allow_reboot | bool

- name: Reboot after the feature install
  ansible.windows.win_reboot:
    reboot_timeout: 1800
  when: wsfc_features.reboot_required | default(false)

# The cluster's node names are computer names, which needn't match inventory
# names; read them from facts rather than guess. The platform subset (in min)
# sets ansible_hostname. Only when the play hasn't gathered it already.
- name: Read the node's computer name
  ansible.windows.setup:
    gather_subset: ['!all', 'min']
  when:
    - wsfc_nodes | length == 0
    - ansible_hostname is not defined

# --- once, on the managing node --------------------------------------------------
- name: Create or converge the cluster
  git_cgallagher.windows.wsfc_cluster:
    name: "{{ wsfc_name }}"
    nodes: "{{ wsfc_node_names }}"
    administrative_access_point: "{{ wsfc_administrative_access_point }}"
    static_addresses: "{{ wsfc_static_addresses }}"
    ignore_networks: "{{ wsfc_ignore_networks }}"
    validate: "{{ wsfc_validate | bool }}"
    validate_ignore: "{{ wsfc_validate_ignore }}"
    report_dir: "{{ wsfc_report_dir }}"
    quorum: "{{ wsfc_quorum }}"
    networks: "{{ wsfc_networks }}"
    properties: "{{ wsfc_properties }}"
    disks: "{{ wsfc_disks }}"
  vars:
    wsfc_node_names: >-
      {{ wsfc_nodes if wsfc_nodes | length > 0 else
         ansible_play_hosts | map('extract', hostvars, 'ansible_hostname') | list }}
    ansible_become_password: "{{ wsfc_become_password }}"
  become: "{{ wsfc_become_user | length > 0 }}"
  become_method: ansible.builtin.runas
  become_user: "{{ wsfc_become_user }}"
  delegate_to: "{{ wsfc_manage_node if wsfc_manage_node | length > 0 else ansible_play_hosts[0] }}"
  run_once: true
  register: wsfc_run
  # wsfc_report_only plans the cluster (the module's check mode) while the
  # feature install above runs for real. The "or ansible_check_mode" keeps
  # --check honest: without it, report_only false would template to
  # check_mode false and the task would write during a check run.
  check_mode: "{{ wsfc_report_only | bool or ansible_check_mode }}"

- name: Report actions and warnings
  ansible.builtin.debug:
    msg:
      - "planned only: {{ wsfc_report_only | bool or ansible_check_mode }}"
      - "actions: {{ wsfc_run.actions | default([]) }}"
      - "warnings: {{ wsfc_run.warnings | default([]) }}"
      - "validation report: {{ wsfc_run.validation_report | default('') }}"
  run_once: true

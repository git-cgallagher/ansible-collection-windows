---
argument_specs:
  main:
    short_description: Build and converge a Windows Server Failover Cluster
    description:
      - Installs Failover Clustering on every host in the play, then, from one managing node, validates the nodes
        (C(Test-Cluster)), creates the cluster (C(New-Cluster)) or adds the nodes it is missing, and converges its
        quorum witness, network names and roles, sites, node votes, common properties and named shared disks.
      - Lays the foundation that file servers, SQL Server failover cluster instances and Always On availability groups
        sit on. It doesn't install SQL Server, create file shares or availability groups; the role README says what
        each of those workloads needs from it.
      - Never removes nodes, sites, disks, networks or witnesses that the variables don't list; it reports them as
        warnings.
      - Supports check mode; check mode and O(wsfc_report_only) report every action without changing the
        cluster.
      - Run it against every node of the cluster in one play (C(hosts) = the cluster's nodes).
    author:
      - Chris Gallagher (@git-cgallagher)
    options:
      wsfc_name:
        type: str
        required: true
        description:
          - Cluster name, which is also the cluster network name (the CNO in Active Directory). At most 15 characters.
      wsfc_nodes:
        type: list
        elements: str
        default: []
        description:
          - Computer names of the cluster's nodes.
          - Empty means the computer name of every host in the play.
      wsfc_manage_node: &opt_manage_node
        type: str
        default: ''
        description:
          - Inventory name of the host that runs C(Test-Cluster), C(New-Cluster) and the rest of the cluster
            configuration. It must be one of the play's hosts.
          - Empty means the first host in the play.
      wsfc_administrative_access_point:
        type: str
        default: ActiveDirectoryAndDns
        choices: [ActiveDirectoryAndDns, Dns, None]
        description:
          - How the cluster is reached, passed to C(New-Cluster -AdministrativeAccessPoint).
          - V(ActiveDirectoryAndDns) creates a computer object (CNO) in Active Directory; the normal choice for
            domain-joined file servers and SQL Server failover cluster instances.
          - V(Dns) registers the name in DNS only, for workgroup and multi-domain clusters (availability groups).
          - V(None) creates no network name or IP address, for availability groups that don't need a cluster name.
          - Only used when the cluster is created; changing it later is reported, not applied.
      wsfc_static_addresses:
        type: list
        elements: str
        default: []
        description:
          - Static IP addresses for the cluster name, one per subnet the nodes span (multi-subnet clusters list
            one per subnet).
          - Empty means DHCP. Ignored when O(wsfc_administrative_access_point=None).
          - Only used when the cluster is created.
          - Each address's network needs a default gateway on the nodes when the cluster is created. C(New-Cluster)
            gives the client role, the only one that can hold the address, only to networks with a gateway, and
            otherwise fails with "no appropriate ClusterandClient network was found".
      wsfc_ignore_networks:
        type: list
        elements: str
        default: []
        description:
          - Networks in CIDR form (V(10.10.20.0/24)) that C(New-Cluster) must not use for the cluster's IP address,
            such as storage or backup networks.
          - C(New-Cluster) can still give the cluster name a DHCP address on one of them, which the name then registers
            in DNS; the role removes such an address on every run, unless it's the name's only one.
      wsfc_extra_features:
        type: list
        elements: str
        default: []
        description:
          - Windows features installed on every node next to C(Failover-Clustering) and its management tools, for
            example V(FS-FileServer) for a clustered file server or V(Multipath-IO) for SAN storage.
      wsfc_allow_reboot:
        type: bool
        default: false
        description:
          - Reboot a node when a feature install needs it. When false the role fails on such a node and says so,
            so a production node is never rebooted unasked.
      wsfc_validate:
        type: bool
        default: true
        description:
          - Run C(Test-Cluster) on the nodes before creating the cluster or adding nodes to it, and fail when a
            test fails. The report is kept in O(wsfc_report_dir) on the managing node.
          - Validation isn't re-run once every node is in the cluster.
      wsfc_validate_ignore:
        type: list
        elements: str
        default: []
        description:
          - Test categories C(Test-Cluster) skips, passed to C(-Ignore), for example V(Storage) for a cluster
            without shared disks (availability groups).
      wsfc_quorum:
        type: dict
        default: {}
        description:
          - The quorum configuration. Empty means leave the quorum that C(New-Cluster) chose (node majority, plus a
            disk witness when it added a disk).
          - A cloud witness's account key can't be read back, so it is only sent when the witness is created or
            its account name or endpoint changes.
        options:
          # Not required here: Ansible validates a dict's required suboptions
          # even when the dict is left at its {} default. tasks/main.yml
          # requires it whenever the quorum is set.
          type:
            type: str
            choices: [node_majority, disk_witness, file_share_witness, cloud_witness]
            description:
              - Required whenever O(wsfc_quorum) is set.
              - V(node_majority) uses no witness; V(disk_witness) a cluster disk; V(file_share_witness) an SMB share
                outside the cluster; V(cloud_witness) an Azure storage account.
          disk:
            type: str
            description:
              - Cluster disk resource name for V(disk_witness), for example one named in O(wsfc_disks).
          path:
            type: str
            description:
              - UNC path of the share for V(file_share_witness), for example V(\\\\fs01.example.com\\witness$).
          account_name:
            type: str
            description:
              - Azure storage account name for V(cloud_witness).
          access_key:
            type: str
            no_log: true
            description:
              - Azure storage account access key for V(cloud_witness). Keep it in a vault.
          endpoint:
            type: str
            description:
              - Azure service endpoint for V(cloud_witness); empty means the public cloud (C(core.windows.net)).
          credential:
            type: dict
            description:
              - The account the cluster connects to a V(file_share_witness) share with, for a share outside the domain
                such as one on a NAS (Windows Server 2019 and later). Leave it out for a share the cluster name object
                can reach.
              - A credential can't be read back, so it is only sent when the witness is set or its path changes.
            options:
              username:
                type: str
                required: true
                description:
                  - The account's name, in the form the share's host expects.
              password:
                type: str
                required: true
                no_log: true
                description:
                  - The account's password. Keep it in a vault.
      wsfc_networks:
        type: list
        elements: dict
        default: []
        description:
          - Cluster networks to name and give a role, matched by subnet. Networks not listed are left alone.
        options:
          subnet:
            type: str
            required: true
            description:
              - The network in CIDR form, for example V(10.10.10.0/24).
          name:
            type: str
            description:
              - Cluster network name, for example V(Client) or V(Heartbeat).
          role:
            type: str
            choices: [none, cluster, cluster_and_client]
            description:
              - V(none) keeps cluster traffic off the network (iSCSI, backup); V(cluster) carries heartbeats and
                CSV traffic only; V(cluster_and_client) also carries client access (and the cluster's IP address).
          metric:
            type: int
            description:
              - Cluster network metric; lower is preferred for cluster traffic. Setting it turns off the automatic
                metric.
      wsfc_properties:
        type: dict
        default: {}
        description:
          - Cluster common properties to set, by name, for example V(SameSubnetThreshold), V(CrossSubnetThreshold),
            V(CrossSubnetDelay) for multi-subnet availability groups, or V(ClusterLogSize).
          - Values are compared as strings with the current value; only differing properties are set.
      wsfc_sites:
        type: list
        elements: dict
        default: []
        description:
          - Site fault domains to create, and the nodes in each, for a cluster across datacenters. With sites, a group
            fails over to a node in its own site before one in another, and heartbeats between sites can be tuned with
            the C(CrossSiteDelay) and C(CrossSiteThreshold) common properties (O(wsfc_properties)).
          - A missing site is created and a listed node is moved into its site. A site the cluster has that this
            doesn't list is reported in a warning and left in place, and so is the site of a node no site lists.
          - Nodes and sites share one set of fault domain names, so a site can't have a node's name.
        options:
          name:
            type: str
            required: true
            description:
              - Site name, for example V(DC1).
          nodes:
            type: list
            elements: str
            description:
              - Computer names of the nodes in the site. A node belongs to one site.
          description:
            type: str
            description:
              - Site description, for example the datacenter's location. Kept as it is when this is left out.
      wsfc_preferred_site:
        type: str
        default: ''
        description:
          - The cluster's preferred site (its C(PreferredSite) property), for example the primary datacenter. Groups
            start in it on a cold start, and in a tie between sites, dynamic quorum takes votes from the other sites
            first so the preferred site keeps the cluster running.
          - One of O(wsfc_sites), or a site the cluster already has. Set it here or in O(wsfc_properties), not both.
          - Empty means leave the current value.
      wsfc_node_weights:
        type: dict
        default: {}
        description:
          - Node votes (C(NodeWeight)) by node computer name. V(1) gives a node a quorum vote and V(0) takes it away,
            for example from disaster recovery nodes that mustn't keep the cluster running on their own.
          - Nodes not listed keep their vote. Dynamic quorum still adjusts the votes of the nodes that have one.
      wsfc_disks:
        type: list
        elements: dict
        default: []
        description:
          - Shared disks to add to the cluster as named cluster disk resources, matched by the disk's C(UniqueId)
            (C(Get-Disk | Select-Object Number, UniqueId) on the managing node), which is the same on every node for
            a shared LUN.
          - A disk already in the cluster under O(wsfc_disks[].name) is left as it is, apart from adding it
            to Cluster Shared Volumes when O(wsfc_disks[].csv) asks for that.
          - SQL Server failover cluster instance setup picks its disks by these resource names.
        options:
          name:
            type: str
            required: true
            description:
              - Cluster disk resource name, for example V(SQL Data).
          unique_id:
            type: str
            required: true
            description:
              - The disk's C(UniqueId) as C(Get-Disk) reports it on the managing node.
          csv:
            type: bool
            default: false
            description:
              - Add the disk to Cluster Shared Volumes (Scale-Out File Server, Hyper-V). Removing a disk from CSV is
                reported, not done.
          initialize:
            type: bool
            default: false
            description:
              - When the disk is still RAW, initialize it (GPT), create one partition and format it before adding
                it. A disk that already has a partition table is never touched.
          file_system:
            type: str
            default: NTFS
            choices: [NTFS, ReFS]
            description:
              - File system for O(wsfc_disks[].initialize).
          allocation_unit_size:
            type: int
            default: 65536
            description:
              - Allocation unit size in bytes for O(wsfc_disks[].initialize); 64 KB is what SQL Server data
                and log volumes want.
          label:
            type: str
            description:
              - Volume label for O(wsfc_disks[].initialize); empty means the disk's resource name.
          drive_letter:
            type: str
            description:
              - Drive letter (V(S)) for the volume O(wsfc_disks[].initialize) creates, so file shares and SQL Server
                paths can name it. The cluster mounts it under that letter on whichever node owns the disk.
              - Empty leaves the volume without a letter. Only used when the disk is initialized.
      wsfc_report_only:
        type: bool
        default: false
        description:
          - Run the cluster task in check mode, so it reports every action without changing the cluster (a plan),
            while the feature install runs for real. Check mode implies it, and then also leaves the feature
            uninstalled.
      wsfc_become_user: &opt_become_user
        type: str
        default: ''
        description:
          - Run the cluster script as this account through C(runas) become, for example V(EXAMPLE\\svc-cluster).
          - C(New-Cluster) and C(Add-ClusterNode) reach the other nodes and Active Directory from the managing node,
            which a plain WinRM logon can't delegate (the double hop); become gives the script a local logon with
            credentials. Empty means the connection user, which works when the connection already delegates
            (CredSSP, Kerberos delegation) or when the cluster has one node.
          - The account needs local administrator rights on every node and, with
            O(wsfc_administrative_access_point=ActiveDirectoryAndDns), rights to create the cluster's
            computer object (or a prestaged, disabled CNO it has Full Control over).
      wsfc_become_password: &opt_become_password
        type: str
        default: ''
        no_log: true
        description:
          - Password of O(wsfc_become_user). Keep it in a vault.
      wsfc_report_dir:
        type: str
        default: 'C:\ProgramData\wsfc-iac'
        description:
          - Directory on the managing node for C(Test-Cluster) reports.

  groups:
    short_description: Converge cluster groups' owners, failback, properties and resources
    description:
      - Runs the C(wsfc_group) module once, from the managing node, for each group in O(wsfc_groups)
        (C(ansible-doc git_cgallagher.windows.wsfc_group)).
      - The main entry point never touches groups, because a workload's group exists only once the workload has
        created it. Run this one after the workload (an FCI's group, after SQL Server setup), or before it for the
        groups every cluster has (C(Available Storage), C(Cluster Group)).
      - An availability group's group belongs to SQL Server; C(wsfc_group) refuses its owners, failback,
        properties and moves, and leaves only its other resources (such as the listener's network name) settable.
      - Supports check mode; check mode and O(wsfc_report_only) report every action without changing the groups.
      - Run it against the cluster's nodes, like the main entry point.
    author:
      - Chris Gallagher (@git-cgallagher)
    options:
      wsfc_groups:
        type: list
        elements: dict
        default: []
        description:
          - The cluster groups to converge, each with the C(wsfc_group) module's options.
        options:
          name:
            type: str
            required: true
            description:
              - The cluster group's name, for example V(Available Storage) or V(SQL Server (MSSQLSERVER)).
          preferred_owners:
            type: list
            elements: str
            description:
              - The group's preferred owners, in order; the list is exact. Left out, the current list stays.
          owner:
            type: str
            description:
              - The node the group should be on now; when it's elsewhere, the group is moved there, after every other
                change.
          move_timeout:
            type: int
            description:
              - Seconds a move may take; the module's default is 300.
          failback:
            type: dict
            description:
              - Whether the group fails back to its most preferred owner, and when.
            options:
              allowed:
                type: bool
                description:
                  - V(true) allows failback, V(false) prevents it. It needs preferred owners to have an effect.
              window_start:
                type: int
                description:
                  - The hour, 0 to 23 in the cluster's local time, from which failback may happen, or V(-1) for no
                    window. Set together with O(wsfc_groups[].failback.window_end).
              window_end:
                type: int
                description:
                  - The hour, 0 to 23, until which failback may happen, or V(-1) for no window.
          properties:
            type: dict
            description:
              - The group's common properties to set, by name, for example V(Description) or V(Priority).
          resources:
            type: list
            elements: dict
            description:
              - Resources in the group to set common and private properties on.
            options:
              name:
                type: str
                required: true
                description:
                  - The resource's name.
              properties:
                type: dict
                description:
                  - The resource's common properties to set, by name.
              parameters:
                type: dict
                description:
                  - The resource's private properties to set, by name, for example the AG listener's V(HostRecordTTL).
                    Some take effect only when the resource restarts, which a warning says; nothing is restarted.
      wsfc_manage_node: *opt_manage_node
      wsfc_report_only:
        type: bool
        default: false
        description:
          - Run the groups task in check mode, so it reports every action without changing the groups. Check mode
            implies it.
      wsfc_become_user: *opt_become_user
      wsfc_become_password: *opt_become_password

  failover:
    short_description: Move a cluster group to another node and back, timing each move
    description:
      - A planned failover test, as for patching a node. Moves O(wsfc_failover_group) to another node with the
        C(wsfc_group) module, waits for it to settle there (online, if it was online), then moves it back the same
        way, and reports how long each move took in C(wsfc_failover_result). It doesn't simulate a crash.
      - An availability group fails over through T-SQL, never through the cluster, so this refuses its group.
      - Reports a change when it moved the group. Check mode and O(wsfc_report_only) report the move without
        making it.
      - Run it against the cluster's nodes, like the main entry point.
    author:
      - Chris Gallagher (@git-cgallagher)
    options:
      wsfc_failover_group:
        type: str
        required: true
        description:
          - The cluster group to move, for example an FCI's V(SQL Server (MSSQLSERVER)) or V(Cluster Group).
      wsfc_failover_to:
        type: str
        default: ''
        description:
          - Computer name of the node to move the group to.
          - Empty means another node that is up, the group's preferred owners first.
      wsfc_failover_back:
        type: bool
        default: true
        description:
          - Move the group back to the node it started on afterwards.
      wsfc_failover_timeout:
        type: int
        default: 300
        description:
          - Seconds each move may take, until the group is settled on its new node.
      wsfc_manage_node: *opt_manage_node
      wsfc_report_only:
        type: bool
        default: false
        description:
          - Report the moves without making them. Check mode implies it.
      wsfc_become_user: *opt_become_user
      wsfc_become_password: *opt_become_password

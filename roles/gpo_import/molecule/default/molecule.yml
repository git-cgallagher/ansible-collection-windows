---
# gpo_import's scenario: seed a real domain, export it with gpo_backup, drift
# it out-of-band, then converge it back from the export (see README.md).
# The driver, platform, provisioner and inventory come from the repository's
# Molecule base config, .config/molecule/config.yml, which Molecule merges
# under this file.
scenario:
  name: default
provisioner:
  env:
    # verify.yml ends by running the gpo_import module's integration target
    # (tests/integration/targets/) as a role; setup_gpo_lab is its dependency.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../tests/integration/targets

---
# meta/argument_specs.yml makes Ansible check types and required variables
# before this runs; a spec can't express "non-empty", so check that here.
- name: Require a non-empty domain and source directory
  ansible.builtin.assert:
    that:
      - gpo_import_domain | default('') | length > 0
      - gpo_import_source_dir | default('') | length > 0
    fail_msg: gpo_import_domain and gpo_import_source_dir must be non-empty
    quiet: true

# Staging tasks run even in --check: the module needs the files to compute
# its plan (and to refuse a cpassword). The staging directory is scratch
# space, not managed state, so these never report a change. The module's
# result is the role's real "changed".
- name: Clear the staging directory
  ansible.windows.win_file:
    path: '{{ gpo_import_workdir }}\stage'
    state: absent
  check_mode: false
  changed_when: false

# Only what the import reads — not the rest of the working copy (.git, CI files).
- name: Stage the GPO backups on the management host
  ansible.windows.win_copy:
    src: "{{ gpo_import_source_dir }}/gpos/"
    dest: '{{ gpo_import_workdir }}\stage\gpos\'
  check_mode: false
  changed_when: false

- name: Stage the manifest
  ansible.windows.win_copy:
    src: "{{ gpo_import_source_dir }}/{{ gpo_import_manifest }}"
    dest: '{{ gpo_import_workdir }}\stage\{{ gpo_import_manifest | dirname }}/'
  check_mode: false
  changed_when: false

# A migration table given as an absolute path already lives on the host.
- name: Stage the migration table
  ansible.windows.win_copy:
    src: "{{ gpo_import_source_dir }}/{{ gpo_import_migration_table }}"
    dest: '{{ gpo_import_workdir }}\stage\{{ gpo_import_migration_table | dirname }}/'
  when:
    - gpo_import_migration_table | length > 0
    - gpo_import_migration_table is not match('^([A-Za-z]:|[\\\\/])')
  check_mode: false
  changed_when: false

# gpo_import_report_only is check mode for this one task: the module predicts
# every action and writes nothing. Otherwise the keyword is omitted, so the
# task follows the play (--check, or check_mode applied to the role's tasks).
- name: Import GPOs and reconcile topology
  git_cgallagher.windows.gpo_import:
    domain: "{{ gpo_import_domain }}"
    server: "{{ gpo_import_server | default(omit, true) }}"
    source_dir: '{{ gpo_import_workdir }}\stage'
    manifest_path: "{{ gpo_import_manifest }}"
    migration_table_path: "{{ gpo_import_migration_table | default(omit, true) }}"
    state_dir: "{{ gpo_import_state_dir }}"
    remove_unmanaged_links: "{{ gpo_import_remove_unmanaged_links | bool }}"
    create_wmi_filters: "{{ gpo_import_create_wmi_filters | bool }}"
    force: "{{ gpo_import_force | bool }}"
    gpo_names: "{{ gpo_import_gpos }}"
  check_mode: "{{ true if gpo_import_report_only | bool else omit }}"
  register: gpo_import_run

- name: Report the actions
  ansible.builtin.debug:
    msg:
      - "actions: {{ gpo_import_run.actions }}"
      - "notices: {{ gpo_import_run.notices }}"

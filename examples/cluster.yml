---
# Three failover clusters built with wsfc. Run each with --check (or
# -e wsfc_report_only=true) first and read the action list.
# Every name, address and disk ID here is a placeholder.

# A two-node file server cluster with shared disks and a disk witness.
- name: Build the file server cluster
  hosts: fsclu01_nodes
  gather_facts: false
  roles:
    - role: git_cgallagher.windows.wsfc
      vars:
        wsfc_name: FSCLU01
        wsfc_static_addresses: [10.10.10.40]
        wsfc_extra_features: [FS-FileServer, Multipath-IO]
        wsfc_allow_reboot: true
        wsfc_networks:
          - {subnet: 10.10.10.0/24, name: Client, role: cluster_and_client}
          - {subnet: 10.10.30.0/24, name: Storage, role: none}
        wsfc_disks:
          - {name: Data, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9C01, initialize: true, allocation_unit_size: 4096}
          - {name: Witness, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9C02, initialize: true}
        wsfc_quorum: {type: disk_witness, disk: Witness}
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

# A SQL Server FCI's cluster: 64 KB-formatted data and log disks, named the
# way SQL Server setup will ask for them.
- name: Build the SQL Server FCI cluster
  hosts: sqlclu01_nodes
  gather_facts: false
  roles:
    - role: git_cgallagher.windows.wsfc
      vars:
        wsfc_name: SQLCLU01
        wsfc_static_addresses: [10.10.10.50]
        wsfc_ignore_networks: [10.10.30.0/24]
        wsfc_disks:
          - {name: SQL Data, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9B01, initialize: true}
          - {name: SQL Log, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9B02, initialize: true}
          - {name: SQL TempDB, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9B03, initialize: true}
        wsfc_quorum: {type: file_share_witness, path: '\\fs01.example.com\witness$\SQLCLU01'}
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

# An availability group's cluster across two subnets: no shared storage, one
# address per subnet, relaxed cross-subnet heartbeats and a cloud witness.
- name: Build the availability group cluster
  hosts: agclu01_nodes
  gather_facts: false
  roles:
    - role: git_cgallagher.windows.wsfc
      vars:
        wsfc_name: AGCLU01
        wsfc_static_addresses: [10.10.10.60, 10.20.10.60]
        wsfc_validate_ignore: [Storage]
        wsfc_properties:
          CrossSubnetThreshold: 40
          CrossSubnetDelay: 1000
          SameSubnetThreshold: 20
        wsfc_quorum:
          type: cloud_witness
          account_name: examplewitness
          access_key: "{{ vault_witness_access_key }}"
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

# The groups and failover entry points: put Available Storage on the node
# SQL Server setup will run on, then (after setup) prefer the FCI's
# first-datacenter nodes and test a failover there and back.
- name: Prepare and test the SQL Server FCI's groups
  hosts: sqlclu01_nodes
  gather_facts: false
  tasks:
    - name: Put Available Storage on the install node
      ansible.builtin.include_role:
        name: git_cgallagher.windows.wsfc
        tasks_from: groups
      vars:
        wsfc_groups:
          - name: Available Storage
            owner: SQL01
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

    # ... SQL Server setup (InstallFailoverCluster, AddNode) runs here ...

    - name: Prefer the first datacenter's nodes, failing back only at night
      ansible.builtin.include_role:
        name: git_cgallagher.windows.wsfc
        tasks_from: groups
      vars:
        wsfc_groups:
          - name: SQL Server (MSSQLSERVER)
            preferred_owners: [SQL01, SQL02]
            failback: {allowed: true, window_start: 1, window_end: 4}
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

    - name: Fail the FCI over and back
      ansible.builtin.include_role:
        name: git_cgallagher.windows.wsfc
        tasks_from: failover
      vars:
        wsfc_failover_group: SQL Server (MSSQLSERVER)
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

# An availability group's cluster on one subnet stretched across two
# datacenters, with the file share witness in a third: a site per
# datacenter, DC1 preferred, and the vSphere profile's heartbeats. The role
# provisions the witness share on witness01 (a Windows server in DC3, in the
# inventory) and lets the cluster name object create the listeners' computer
# objects, for a domain whose machine account quota is 0.
- name: Build the stretched availability group cluster
  hosts: agclu02_nodes            # ag11, ag12 in DC1; ag21, ag22 in DC2
  gather_facts: false
  roles:
    - role: git_cgallagher.windows.wsfc
      vars:
        wsfc_name: AGCLU02
        wsfc_static_addresses: [10.10.10.70]
        wsfc_validate_ignore: [Storage]
        wsfc_sites:
          - {name: DC1, nodes: [AG11, AG12], description: Primary datacenter}
          - {name: DC2, nodes: [AG21, AG22], description: Secondary datacenter}
        wsfc_preferred_site: DC1
        wsfc_properties:
          SameSubnetThreshold: 10
          CrossSubnetThreshold: 20
          CrossSiteThreshold: 20
          RouteHistoryLength: 40
        wsfc_quorum:
          type: file_share_witness
          path: '\\witness01.dc3.example.com\AGCLU02-Witness'
        wsfc_witness_share:
          host: witness01
          path: 'C:\ClusterWitness\AGCLU02'
        wsfc_cno_create_computer_objects: true
        wsfc_become_user: EXAMPLE\svc-cluster-build
        wsfc_become_password: "{{ vault_cluster_build_password }}"

---
# Run by .github/workflows/argument-specs.yml against the built and installed
# collection. Needs no Windows host: everything here fails (or passes) before
# a role's first task would connect anywhere.

- name: Check each role's argument spec against its defaults
  hosts: localhost
  gather_facts: false
  vars:
    spec_roles_dir: "{{ playbook_dir }}/../../roles"
  tasks:
    - name: Check one role
      ansible.builtin.include_tasks: check_role.yml
      loop: [gpo_backup, gpo_import, wsfc, wsfc_fileserver, mssql_prereqs]
      loop_control:
        loop_var: spec_role

- name: Exercise the argument specs
  hosts: localhost
  gather_facts: false
  vars:
    spec_roles_dir: "{{ playbook_dir }}/../../roles"
    spec_backup: "{{ (lookup('ansible.builtin.file', spec_roles_dir ~ '/gpo_backup/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
    spec_import: "{{ (lookup('ansible.builtin.file', spec_roles_dir ~ '/gpo_import/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
    spec_cluster: "{{ (lookup('ansible.builtin.file', spec_roles_dir ~ '/wsfc/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
    spec_fileserver: "{{ (lookup('ansible.builtin.file', spec_roles_dir ~ '/wsfc_fileserver/meta/argument_specs.yml') | from_yaml).argument_specs }}"
  tasks:
    # --- valid input passes ---------------------------------------------------------
    - name: Accept a minimal gpo_backup call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_backup }}"
        provided_arguments:
          gpo_backup_domain: lab.example.com
          gpo_backup_repo_dir: /srv/gpo-repo

    - name: Accept a full gpo_import call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_import }}"
        provided_arguments:
          gpo_import_domain: prod.example.com
          gpo_import_source_dir: /srv/gpo-repo
          gpo_import_server: dc01.prod.example.com
          gpo_import_migration_table: migtables/prod.migtable
          gpo_import_report_only: true
          gpo_import_remove_unmanaged_links: false
          gpo_import_create_wmi_filters: true
          gpo_import_force: false
          gpo_import_gpos: [SEC - Server Baseline]

    - name: Accept a minimal wsfc call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_cluster }}"
        provided_arguments:
          wsfc_name: SQLCLU01

    - name: Accept a full wsfc call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_cluster }}"
        provided_arguments:
          wsfc_name: SQLCLU01
          wsfc_nodes: [sql01, sql02]
          wsfc_manage_node: sql01.example.com
          wsfc_administrative_access_point: Dns
          wsfc_static_addresses: [10.10.10.50, 10.20.10.50]
          wsfc_ignore_networks: [10.10.30.0/24]
          wsfc_extra_features: [FS-FileServer]
          wsfc_allow_reboot: true
          wsfc_validate: true
          wsfc_validate_ignore: [Storage]
          wsfc_quorum: {type: cloud_witness, account_name: examplewitness, access_key: example-not-secret}
          wsfc_networks:
            - {subnet: 10.10.10.0/24, name: Client, role: cluster_and_client, metric: 1000}
          wsfc_properties: {SameSubnetThreshold: 20}
          wsfc_sites:
            - {name: DC1, nodes: [sql01], description: Primary datacenter}
            - {name: DC2, nodes: [sql02]}
            - {name: DC3}
          wsfc_preferred_site: DC1
          wsfc_node_weights: {sql02: 0}
          wsfc_disks:
            - {name: SQL Data, unique_id: 60003FF44DC75ADC8C3A5E1C1A0A9B01, initialize: true, file_system: ReFS}
          wsfc_report_only: true
          wsfc_become_user: EXAMPLE\svc-cluster-build
          wsfc_become_password: example-not-secret

    - name: Accept a wsfc file share witness with a credential
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_cluster }}"
        provided_arguments:
          wsfc_name: SQLCLU01
          wsfc_quorum:
            type: file_share_witness
            path: '\\nas01.example.com\witness'
            credential: {username: witness, password: example-not-secret}

    # --- invalid input is rejected by the roles themselves --------------------------
    - name: Accept a minimal wsfc_fileserver call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_fileserver.main.options }}"
        provided_arguments:
          wsfc_fileserver_name: FS01

    - name: Accept a full wsfc_fileserver call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_fileserver.main.options }}"
        provided_arguments:
          wsfc_fileserver_name: FS01
          wsfc_fileserver_static_addresses: [10.10.10.60, 10.20.20.60]
          wsfc_fileserver_ignore_networks: [192.168.50.0/24]
          wsfc_fileserver_disks: [FS Data]
          wsfc_fileserver_shares:
            - name: Projects
              path: 'S:\Shares\Projects'
              description: Team projects
              full_access: ['EXAMPLE\File Admins']
              change_access: ['EXAMPLE\Domain Users']
              folder_enumeration_mode: AccessBased
              encrypt_data: true
            - {name: VMs, path: 'S:\Shares\VMs', continuously_available: true, read_access: [Everyone]}
          wsfc_fileserver_preferred_owners: [NODE1, NODE2]
          wsfc_fileserver_report_only: true
          wsfc_fileserver_manage_node: node1
          wsfc_fileserver_become_user: 'EXAMPLE\svc-cluster'
          wsfc_fileserver_become_password: example-not-secret

    - name: Accept a full wsfc_fileserver failover call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_fileserver.failover.options }}"
        provided_arguments:
          wsfc_fileserver_name: FS01
          wsfc_fileserver_validate_client: client01
          wsfc_fileserver_validate_shares: [Projects]
          wsfc_fileserver_failover_to: NODE2
          wsfc_fileserver_failover_timeout: 600

    # include_role runs the role's implicit "Validating arguments" task first; a
    # failure there carries argument_errors, which tells it apart from a later
    # task failing.
    - name: Reject gpo_backup without its required domain
      block:
        - name: Include gpo_backup without gpo_backup_domain
          ansible.builtin.include_role:
            name: git_cgallagher.windows.gpo_backup
          vars:
            gpo_backup_repo_dir: /srv/gpo-repo

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: gpo_backup ran without gpo_backup_domain
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('gpo_backup_domain')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a non-boolean gpo_import flag
      block:
        - name: Include gpo_import with gpo_import_report_only=maybe
          ansible.builtin.include_role:
            name: git_cgallagher.windows.gpo_import
          vars:
            gpo_import_domain: prod.example.com
            gpo_import_source_dir: /srv/gpo-repo
            gpo_import_report_only: maybe

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: gpo_import accepted gpo_import_report_only=maybe
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('gpo_import_report_only')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a gpo_import GPO filter that isn't a list
      block:
        - name: Include gpo_import with a mapping for gpo_import_gpos
          ansible.builtin.include_role:
            name: git_cgallagher.windows.gpo_import
          vars:
            gpo_import_domain: prod.example.com
            gpo_import_source_dir: /srv/gpo-repo
            gpo_import_gpos:
              name: SEC - Server Baseline

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: gpo_import accepted a mapping for gpo_import_gpos
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('gpo_import_gpos')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    # A spec can't say "non-empty"; the role's first task does.
    - name: Reject an empty gpo_import domain
      block:
        - name: Include gpo_import with an empty domain
          ansible.builtin.include_role:
            name: git_cgallagher.windows.gpo_import
          vars:
            gpo_import_domain: ''
            gpo_import_source_dir: /srv/gpo-repo

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: gpo_import ran with an empty domain
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('must be non-empty')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject an unknown wsfc access point
      block:
        - name: Include wsfc with access point Workgroup
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_administrative_access_point: Workgroup

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc accepted access point Workgroup
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('wsfc_administrative_access_point')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject an unknown wsfc quorum type
      block:
        - name: Include wsfc with quorum type majority
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_quorum:
              type: majority

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc accepted quorum type majority
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('wsfc_quorum')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    # The spec leaves the quorum's type optional (see its comment); the role's
    # first task requires it.
    - name: Reject a wsfc quorum without a type
      block:
        - name: Include wsfc with a typeless quorum
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_quorum:
              path: '\\fs01.example.com\witness$'

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: wsfc accepted a quorum without a type
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('needs a type')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a wsfc site without a name
      block:
        - name: Include wsfc with a nameless site
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_sites:
              - nodes: [sql01]

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc accepted a site without a name
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('name')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a wsfc witness credential without a password
      block:
        - name: Include wsfc with a passwordless witness credential
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_quorum:
              type: file_share_witness
              path: '\\nas01.example.com\witness'
              credential: {username: witness}

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc accepted a witness credential without a password
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('password')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    # A spec can't limit a dict's values; the role's first task does.
    - name: Reject a wsfc node weight other than 0 or 1
      block:
        - name: Include wsfc with a node weight of 2
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_node_weights: {sql01: 2}

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: wsfc accepted a node weight of 2
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('must be 0 or 1')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a wsfc disk without a unique_id
      block:
        - name: Include wsfc with a disk that has no unique_id
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLU01
            wsfc_disks:
              - name: SQL Data

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc accepted a disk without a unique_id
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('unique_id')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    # A spec can't limit a string's length; the role's first task does.
    - name: Reject a wsfc name longer than 15 characters
      block:
        - name: Include wsfc with a 16-character name
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc
          vars:
            wsfc_name: SQLCLUSTER-PROD1

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: wsfc ran with a 16-character name
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('at most 15 characters')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a wsfc_fileserver share without a path
      block:
        - name: Include wsfc_fileserver with a pathless share
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc_fileserver
          vars:
            wsfc_fileserver_name: FS01
            wsfc_fileserver_shares:
              - name: Projects

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc_fileserver accepted a share without a path
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('path')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject an unknown wsfc_fileserver folder enumeration mode
      block:
        - name: Include wsfc_fileserver with folder_enumeration_mode Hidden
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc_fileserver
          vars:
            wsfc_fileserver_name: FS01
            wsfc_fileserver_shares:
              - {name: Projects, path: 'S:\Shares\Projects', folder_enumeration_mode: Hidden}

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc_fileserver accepted folder_enumeration_mode Hidden
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('folder_enumeration_mode')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject two wsfc_fileserver shares with the same name
      block:
        - name: Include wsfc_fileserver with a duplicate share name
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc_fileserver
          vars:
            wsfc_fileserver_name: FS01
            wsfc_fileserver_shares:
              - {name: Projects, path: 'S:\Shares\Projects'}
              - {name: Projects, path: 'T:\Projects'}

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: wsfc_fileserver accepted two shares named Projects
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('share names must be unique')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    # The failover entry point is validated against its own spec.
    - name: Reject a non-integer wsfc_fileserver failover timeout
      block:
        - name: Include wsfc_fileserver's failover with a timeout of soon
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc_fileserver
            tasks_from: failover
          vars:
            wsfc_fileserver_name: FS01
            wsfc_fileserver_validate_shares: [Projects]
            wsfc_fileserver_failover_timeout: soon

        - name: Fail because validation accepted it
          ansible.builtin.fail:
            msg: wsfc_fileserver failover accepted a timeout of soon
      rescue:
        - name: Check the argument spec rejected it
          ansible.builtin.assert:
            that: ansible_failed_result.argument_errors | default([]) | join(' ') is search('wsfc_fileserver_failover_timeout')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

    - name: Reject a wsfc_fileserver failover with no shares to check
      block:
        - name: Include wsfc_fileserver's failover without shares
          ansible.builtin.include_role:
            name: git_cgallagher.windows.wsfc_fileserver
            tasks_from: failover
          vars:
            wsfc_fileserver_name: FS01

        - name: Fail because the role accepted it
          ansible.builtin.fail:
            msg: wsfc_fileserver failover ran with no shares to check
      rescue:
        - name: Check the role's own check rejected it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.argument_errors is not defined
              - ansible_failed_result.msg | default('') is search('shares to check')
            fail_msg: "Unexpected failure: {{ ansible_failed_result }}"

# mssql_prereqs: its argument spec, then its plan (tasks/plan.yml), which
# fills in defaults, builds the SPNs and validates the whole list without
# touching Active Directory, so it runs here without a Windows host.
- name: Exercise mssql_prereqs' argument spec
  hosts: localhost
  gather_facts: false
  vars:
    spec_roles_dir: "{{ playbook_dir }}/../../roles"
    spec_prereqs: "{{ (lookup('ansible.builtin.file', spec_roles_dir ~ '/mssql_prereqs/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
  tasks:
    - name: Accept a minimal mssql_prereqs call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_prereqs }}"
        provided_arguments: {}

    - name: Accept a full mssql_prereqs call
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ spec_prereqs }}"
        provided_arguments:
          mssql_prereqs_accounts:
            - name: svc-sqldb
              type: user
              password: example-not-secret
              path: OU=SQL,DC=example,DC=com
              description: SQL Server engine
              upn: svc-sqldb@example.com
              spn_sets:
                - {hosts: [sql01.example.com, ag01-lsn.example.com], port: 1433, instance: MSSQLSERVER, short_names: true}
              extra_spns: [MSSQLSvc/sqlfci01.example.com:1433]
              state: present
            - name: gmsa-sqlagt
              type: gmsa
              dns_hostname: gmsa-sqlagt.example.com
              retrieve_password: [SQL01$, GG-SQL-Hosts]
          mssql_prereqs_groups:
            - {name: GG-SQL-Hosts, scope: global, path: 'OU=SQL,DC=example,DC=com', description: SQL hosts, members: [SQL01$], state: present}
          mssql_prereqs_exclusive: true
          mssql_prereqs_kds_root_key: create
          mssql_prereqs_kds_root_key_effective_time_hours: 10
          mssql_prereqs_domain_server: dc01.example.com
          mssql_prereqs_domain_username: EXAMPLE\svc-ad-build
          mssql_prereqs_domain_password: example-not-secret
          mssql_prereqs_report_only: true

    - name: Reject what the argument spec rules out
      ansible.builtin.include_tasks: mssql_prereqs_spec_reject.yml
      loop:
        - case: an account type of msa
          accounts: [{name: svc-a, type: msa}]
          expect: mssql_prereqs_accounts
        - case: an account without a name
          accounts: [{type: user, password: x}]
          expect: mssql_prereqs_accounts
        - case: a group scope of local
          groups: [{name: GG-A, scope: local}]
          expect: mssql_prereqs_groups
        - case: a KDS root key mode of always
          kds: always
          expect: mssql_prereqs_kds_root_key
      loop_control:
        loop_var: spec_case
        label: "{{ spec_case.case }}"

- name: Exercise mssql_prereqs' plan
  hosts: localhost
  gather_facts: false
  vars:
    plan_accounts:
      - name: svc-sqldb-lab
        password: example-not-secret
        spn_sets:
          - hosts: [sql01.example.com, ag01-lsn.example.com]
            short_names: true
      - name: svc-sqlinst-lab
        password: example-not-secret
        spn_sets:
          - {hosts: [sql02.example.com], port: 14330, instance: INST1}
        extra_spns: [MSSQLSvc/sqlfci01.example.com:14330]
      - name: gmsa-sqlagt
        type: gmsa
        dns_hostname: gmsa-sqlagt.example.com
        retrieve_password: [GG-SQL-Hosts]
        spn_sets:
          - hosts: [sqlfci02.example.com]
      # Absent accounts get no SPNs, so they can hand theirs to another.
      - name: svc-gone
        state: absent
        spn_sets:
          - hosts: [sql01.example.com]
  tasks:
    - name: Plan the accounts
      ansible.builtin.include_role:
        name: git_cgallagher.windows.mssql_prereqs
        tasks_from: plan
        public: true
      vars:
        mssql_prereqs_accounts: "{{ plan_accounts }}"

    - name: Check the SPNs, and that no password reached the planned accounts
      ansible.builtin.assert:
        that:
          - mssql_prereqs__spns['svc-sqldb-lab'] | sort == plan_expected_db | sort
          - mssql_prereqs__spns['svc-sqlinst-lab'] | sort == plan_expected_inst | sort
          - mssql_prereqs__spns['gmsa-sqlagt'] | sort == plan_expected_gmsa | sort
          - "'svc-gone' not in mssql_prereqs__spns"
          - mssql_prereqs__accounts | selectattr('password', 'defined') | list | length == 0
        fail_msg: "Planned {{ mssql_prereqs__spns | to_json }}"
      vars:
        plan_expected_db:
          - MSSQLSvc/sql01.example.com:1433
          - MSSQLSvc/ag01-lsn.example.com:1433
          - MSSQLSvc/sql01:1433
          - MSSQLSvc/ag01-lsn:1433
          - MSSQLSvc/sql01.example.com
          - MSSQLSvc/ag01-lsn.example.com
          - MSSQLSvc/sql01
          - MSSQLSvc/ag01-lsn
        plan_expected_inst:
          - MSSQLSvc/sql02.example.com:14330
          - MSSQLSvc/sql02.example.com:INST1
          - MSSQLSvc/sqlfci01.example.com:14330
        plan_expected_gmsa:
          - MSSQLSvc/sqlfci02.example.com:1433
          - MSSQLSvc/sqlfci02.example.com

    - name: Refuse each kind of input the plan can't apply
      ansible.builtin.include_tasks: mssql_prereqs_reject.yml
      loop:
        - case: a user without a password
          accounts: [{name: svc-a}]
          expect: "Users without a password: \\['svc-a'\\]"
        - case: a gMSA without dns_hostname
          accounts: [{name: gmsa-a, type: gmsa}]
          expect: "gMSAs without dns_hostname: \\['gmsa-a'\\]"
        - case: a gMSA name over 15 characters
          accounts: [{name: gmsa-much-too-long, type: gmsa, dns_hostname: x.example.com}]
          expect: "at most 15\\): \\['gmsa-much-too-long'\\]"
        - case: a host name with a space
          accounts: [{name: svc-b, password: x, spn_sets: [{hosts: ['sql 01.example.com']}]}]
          expect: "letters, digits, '.' and '-': \\['sql 01.example.com'\\]"
        - case: an instance name starting with a digit
          accounts: [{name: svc-c, password: x, spn_sets: [{hosts: [sql01.example.com], instance: 1BAD}]}]
          expect: "Invalid instance names: \\['1BAD'\\]"
        - case: an extra SPN with a wildcard
          accounts: [{name: svc-d, password: x, extra_spns: ['MSSQLSvc/*']}]
          expect: "a backslash: \\['MSSQLSvc/\\*'\\]"
        - case: one SPN on two accounts
          accounts:
            - {name: svc-e, password: x, spn_sets: [{hosts: [sql09.example.com]}]}
            - {name: svc-f, password: x, extra_spns: [MSSQLSvc/SQL09.example.com:1433]}
          expect: "one account\\): \\['mssqlsvc/sql09.example.com:1433'\\]"
        - case: a name listed twice
          accounts: [{name: svc-g, password: x}, {name: SVC-G, password: y}]
          expect: "Names listed more than once: \\['svc-g'\\]"
      loop_control:
        loop_var: plan_case
        label: "{{ plan_case.case }}"

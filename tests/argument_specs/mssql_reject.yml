---
# Included by validate.yml once per case (plan_case: case, vars, expect):
# input the argument spec accepts but mssql's plan.yml refuses, before the
# role touches a host.
- name: "Refuse {{ plan_case.case }}"
  block:
    - name: Plan the input
      ansible.builtin.include_role:
        name: git_cgallagher.windows.mssql
        tasks_from: plan
      vars:
        mssql_version: "{{ plan_case.vars.version | default('2022') }}"
        mssql_edition: "{{ plan_case.vars.edition | default('enterprise_developer') }}"
        mssql_product_key: "{{ plan_case.vars.product_key | default('') }}"
        mssql_media: "{{ plan_case.vars.media | default(spec_mssql_media) }}"
        mssql_sysadmins: "{{ plan_case.vars.sysadmins | default(['EXAMPLE\\GG-SQL-Admins']) }}"
        mssql_features: "{{ plan_case.vars.features | default(['SQLEngine']) }}"
        mssql_engine_account: "{{ plan_case.vars.engine_account | default('') }}"
        mssql_engine_password: "{{ plan_case.vars.engine_password | default('') }}"
        mssql_agent_account: "{{ plan_case.vars.agent_account | default('') }}"
        mssql_agent_password: "{{ plan_case.vars.agent_password | default('') }}"

    - name: Fail because the plan accepted it
      ansible.builtin.fail:
        msg: "mssql planned {{ plan_case.case }}"
  rescue:
    - name: Check the plan refused it, and said why
      ansible.builtin.assert:
        that:
          - ansible_failed_result.argument_errors is not defined
          - ansible_failed_result.msg | default('') is search(plan_case.expect)
        fail_msg: "{{ plan_case.case }}: {{ ansible_failed_result.msg | default(ansible_failed_result) | string }}"

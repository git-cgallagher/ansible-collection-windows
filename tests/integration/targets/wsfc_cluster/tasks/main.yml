---
# Integration tests for git_cgallagher.windows.wsfc_cluster on one node.
# setup_wsfc (meta/main.yml) has installed Failover Clustering and read the
# node's computer name. Every check reads the cluster through setup_wsfc's
# cluster_state.ps1 (the FailoverClusters cmdlets), never through the module
# under test. Each change runs in check mode first (predicts it, writes
# nothing), then for real, then again (no change).
#
# The cluster tasks run through runas become: New-Cluster reaches the node
# again from inside the WinRM session, which a plain logon can't delegate.
# Starts by removing any cluster the node is in, and always removes its own.
- name: Remove any cluster the node is in
  ansible.windows.win_powershell:
    script: "{{ setup_wsfc_remove_script }}"
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ ansible_user }}"
  vars:
    ansible_become_password: "{{ ansible_password }}"

- name: Test wsfc_cluster, then clean up
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ ansible_user }}"
  vars:
    ansible_become_password: "{{ ansible_password }}"
    wsfc_cluster_test_network_name: Ansible Test
    wsfc_cluster_test_metric: 31000
    wsfc_cluster_test_same_subnet: 25
    wsfc_cluster_test_cross_subnet: 30
    wsfc_cluster_test_site1: WSFCTESTDC1
    wsfc_cluster_test_site2: WSFCTESTDC2
    wsfc_cluster_test_sites:
      - {name: "{{ wsfc_cluster_test_site1 }}", nodes: ["{{ ansible_facts.hostname }}"], description: Test site one}
      - {name: "{{ wsfc_cluster_test_site2 }}"}
    wsfc_cluster_host: "{{ ansible_facts.hostname | upper }}"
  block:
    # --- create ----------------------------------------------------------------
    - name: Plan the cluster's creation (check mode)
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
        quorum:
          type: node_majority
      check_mode: true
      diff: true
      register: wsfc_cluster_create_check

    - name: Read the cluster after the check-mode create
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read

    - name: Check check mode predicted the create, warned about the rest, and wrote nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_create_check is changed
          - not wsfc_cluster_create_check.created
          - wsfc_cluster_create_check.cluster == setup_wsfc_name
          - wsfc_cluster_create_check.actions | length == 1
          - wsfc_cluster_create_check.actions[0] is search('create cluster ' ~ setup_wsfc_name)
          - wsfc_cluster_create_check.actions[0] is search('access point None')
          - wsfc_cluster_create_check.diff.prepared is search('create cluster ' ~ setup_wsfc_name)
          - wsfc_cluster_create_check.warnings | select('search', 'planned once the cluster exists') | list | length == 1
          - not wsfc_cluster_read.result.exists
        fail_msg: "{{ wsfc_cluster_create_check }} / {{ wsfc_cluster_read.result }}"

    - name: Create the cluster
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
      diff: true
      register: wsfc_cluster_create

    - name: Read the cluster after the create
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read

    - name: Check the cluster exists with this node in it
      ansible.builtin.assert:
        that:
          - wsfc_cluster_create is changed
          - wsfc_cluster_create.created
          - wsfc_cluster_create.actions | length == 1
          - wsfc_cluster_create.actions[0] is search('create cluster ' ~ setup_wsfc_name)
          - wsfc_cluster_create.diff.prepared.splitlines() == wsfc_cluster_create.actions
          - wsfc_cluster_create.validation_report == ''
          - wsfc_cluster_read.result.exists
          - wsfc_cluster_read.result.name == setup_wsfc_name
          - wsfc_cluster_read.result.nodes | map('upper') | list == [ansible_facts.hostname | upper]
          - wsfc_cluster_read.result.node_states == ['Up']
          - wsfc_cluster_read.result.networks | length >= 1
        fail_msg: "{{ wsfc_cluster_create }} / {{ wsfc_cluster_read.result }}"

    - name: Create the cluster again
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
      register: wsfc_cluster_create_again

    - name: Check the repeat changed nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_create_again is not changed
          - not wsfc_cluster_create_again.created
          - wsfc_cluster_create_again.actions == []
        fail_msg: "{{ wsfc_cluster_create_again | string }}"

    # --- converge the network, properties and quorum ---------------------------------
    # The network's subnet comes from the cluster, so the test works on any host.
    - name: Converge the network, properties and quorum (check mode)
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        networks:
          - subnet: "{{ wsfc_cluster_subnet }}"
            name: "{{ wsfc_cluster_test_network_name }}"
            role: cluster
            metric: "{{ wsfc_cluster_test_metric }}"
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
          CrossSubnetThreshold: "{{ wsfc_cluster_test_cross_subnet }}"
        quorum:
          type: node_majority
      vars:
        wsfc_cluster_subnet: "{{ wsfc_cluster_read.result.networks[0].subnet }}"
      check_mode: true
      diff: true
      register: wsfc_cluster_converge_check

    - name: Read the cluster after the check-mode converge
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_after_check

    - name: Check check mode planned the changes and wrote nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_converge_check is changed
          - wsfc_cluster_converge_check.actions | select('search', 'rename network') | list | length == 1
          - wsfc_cluster_converge_check.actions | select('search', 'metric') | list | length == 1
          - wsfc_cluster_converge_check.actions | select('search', 'property SameSubnetThreshold') | list | length == 1
          - wsfc_cluster_converge_check.actions | select('search', 'property CrossSubnetThreshold') | list | length == 1
          - wsfc_cluster_converge_check.diff.prepared.splitlines() == wsfc_cluster_converge_check.actions
          - wsfc_cluster_read_after_check.result.networks == wsfc_cluster_read.result.networks
          - wsfc_cluster_read_after_check.result.same_subnet_threshold == wsfc_cluster_read.result.same_subnet_threshold
        fail_msg: "{{ wsfc_cluster_converge_check }} / {{ wsfc_cluster_read_after_check.result }}"

    - name: Converge the network, properties and quorum
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        networks:
          - subnet: "{{ wsfc_cluster_subnet }}"
            name: "{{ wsfc_cluster_test_network_name }}"
            role: cluster
            metric: "{{ wsfc_cluster_test_metric }}"
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
          CrossSubnetThreshold: "{{ wsfc_cluster_test_cross_subnet }}"
        quorum:
          type: node_majority
      vars:
        wsfc_cluster_subnet: "{{ wsfc_cluster_read.result.networks[0].subnet }}"
      register: wsfc_cluster_converge

    - name: Read the cluster after the converge
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_converged

    - name: Check the cluster matches the options
      ansible.builtin.assert:
        that:
          - wsfc_cluster_converge is changed
          - not wsfc_cluster_converge.created
          - wsfc_cluster_converge.actions == wsfc_cluster_converge_check.actions
          - wsfc_cluster_read_converged.result.networks[0].name == wsfc_cluster_test_network_name
          - wsfc_cluster_read_converged.result.networks[0].role == 1
          - wsfc_cluster_read_converged.result.networks[0].metric == wsfc_cluster_test_metric
          - wsfc_cluster_read_converged.result.same_subnet_threshold == wsfc_cluster_test_same_subnet
          - wsfc_cluster_read_converged.result.cross_subnet_threshold == wsfc_cluster_test_cross_subnet
          - not wsfc_cluster_read_converged.result.witness
        fail_msg: "{{ wsfc_cluster_converge }} / {{ wsfc_cluster_read_converged.result }}"

    - name: Converge again
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        networks:
          - subnet: "{{ wsfc_cluster_subnet }}"
            name: "{{ wsfc_cluster_test_network_name }}"
            role: cluster
            metric: "{{ wsfc_cluster_test_metric }}"
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
          CrossSubnetThreshold: "{{ wsfc_cluster_test_cross_subnet }}"
        quorum:
          type: node_majority
      vars:
        wsfc_cluster_subnet: "{{ wsfc_cluster_read.result.networks[0].subnet }}"
      register: wsfc_cluster_converge_again

    - name: Check the repeat changed nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_converge_again is not changed
          - wsfc_cluster_converge_again.actions == []
        fail_msg: "{{ wsfc_cluster_converge_again | string }}"

    # --- out-of-band drift ------------------------------------------------------------
    - name: Drift a property and the network's name out-of-band
      ansible.windows.win_powershell:
        script: |
          param([string]$Name)
          $ErrorActionPreference = 'Stop'
          Import-Module -Name FailoverClusters
          $cluster = Get-Cluster -Name $env:COMPUTERNAME
          $cluster.SameSubnetThreshold = 12
          $network = Get-ClusterNetwork -Cluster $env:COMPUTERNAME -Name $Name
          $network.Name = 'Drifted'
          # Read both back: a drift that didn't take would fail the plan's
          # assertions later with a misleading message.
          $after = Get-Cluster -Name $env:COMPUTERNAME
          if ([int]$after.SameSubnetThreshold -ne 12) { throw "SameSubnetThreshold is $($after.SameSubnetThreshold), not 12" }
          if (-not (Get-ClusterNetwork -Cluster $env:COMPUTERNAME | Where-Object { $_.Name -eq 'Drifted' })) {
              throw "The network wasn't renamed to Drifted"
          }
        parameters:
          Name: "{{ wsfc_cluster_test_network_name }}"

    - name: Plan the fix (check mode)
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        networks:
          - subnet: "{{ wsfc_cluster_subnet }}"
            name: "{{ wsfc_cluster_test_network_name }}"
            role: cluster
            metric: "{{ wsfc_cluster_test_metric }}"
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
          CrossSubnetThreshold: "{{ wsfc_cluster_test_cross_subnet }}"
        quorum:
          type: node_majority
      vars:
        wsfc_cluster_subnet: "{{ wsfc_cluster_read.result.networks[0].subnet }}"
      check_mode: true
      diff: true
      register: wsfc_cluster_drift_check

    - name: Read the cluster after the plan
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_drifted

    - name: Check the plan has exactly the two fixes and the drift is still there
      ansible.builtin.assert:
        that:
          - wsfc_cluster_drift_check is changed
          - wsfc_cluster_drift_check.actions | length == 2
          - wsfc_cluster_drift_check.actions | select('search', 'rename network Drifted') | list | length == 1
          - wsfc_cluster_drift_check.actions | select('search', "SameSubnetThreshold from '12' to '" ~ wsfc_cluster_test_same_subnet ~ "'") | list | length == 1
          - wsfc_cluster_read_drifted.result.same_subnet_threshold == 12
          - wsfc_cluster_read_drifted.result.networks[0].name == 'Drifted'
        fail_msg: "{{ wsfc_cluster_drift_check }} / {{ wsfc_cluster_read_drifted.result }}"

    - name: Fix the drift
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        networks:
          - subnet: "{{ wsfc_cluster_subnet }}"
            name: "{{ wsfc_cluster_test_network_name }}"
            role: cluster
            metric: "{{ wsfc_cluster_test_metric }}"
        properties:
          SameSubnetThreshold: "{{ wsfc_cluster_test_same_subnet }}"
          CrossSubnetThreshold: "{{ wsfc_cluster_test_cross_subnet }}"
        quorum:
          type: node_majority
      vars:
        wsfc_cluster_subnet: "{{ wsfc_cluster_read.result.networks[0].subnet }}"
      register: wsfc_cluster_drift_fix

    - name: Read the cluster after the fix
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_fixed

    - name: Check the drift was fixed, and only that
      ansible.builtin.assert:
        that:
          - wsfc_cluster_drift_fix is changed
          - wsfc_cluster_drift_fix.actions == wsfc_cluster_drift_check.actions
          - wsfc_cluster_read_fixed.result == wsfc_cluster_read_converged.result
        fail_msg: "{{ wsfc_cluster_drift_fix }} / {{ wsfc_cluster_read_fixed.result }}"

    # --- errors ---------------------------------------------------------------------------
    - name: Name a cluster this node doesn't belong to
      git_cgallagher.windows.wsfc_cluster:
        name: WSFCOTHER
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
      register: wsfc_cluster_wrong_name
      failed_when: >-
        'already belongs to cluster ' ~ setup_wsfc_name not in (wsfc_cluster_wrong_name.msg | default(''))

    - name: Set a common property the cluster doesn't have
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        properties:
          NoSuchProperty: 1
      register: wsfc_cluster_bad_property
      failed_when: "'has no common property' not in (wsfc_cluster_bad_property.msg | default(''))"

    - name: Leave the disk out of a disk witness quorum
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        quorum:
          type: disk_witness
      register: wsfc_cluster_bad_quorum
      failed_when: >-
        'type is disk_witness but all of the following are missing: disk' not in (wsfc_cluster_bad_quorum.msg | default(''))

    - name: Read the cluster after the failures
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_after_errors

    - name: Check the failures changed nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_wrong_name is not changed
          - wsfc_cluster_bad_property is not changed
          - wsfc_cluster_bad_quorum is not changed
          - wsfc_cluster_read_after_errors.result == wsfc_cluster_read_converged.result
        fail_msg: "{{ wsfc_cluster_read_after_errors.result | string }}"

    # --- sites, the preferred site and node votes --------------------------------------
    # One node: it goes into the first site and the second stays empty. Its
    # vote is listed at the value it has; taking a vote away needs a second
    # node, which wsfc_fileserver's two-node lab does.
    - name: Plan the sites, the preferred site and the vote (check mode)
      git_cgallagher.windows.wsfc_cluster: &wsfc_cluster_sites_args
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        sites: "{{ wsfc_cluster_test_sites }}"
        preferred_site: "{{ wsfc_cluster_test_site1 }}"
        node_weights: "{{ {ansible_facts.hostname: 1} }}"
      check_mode: true
      diff: true
      register: wsfc_cluster_sites_check

    - name: Read the cluster after the check-mode sites
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_sites_check

    - name: Check check mode planned the sites and wrote nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites_check is changed
          - wsfc_cluster_sites_check.actions | length == 4
          - wsfc_cluster_sites_check.actions[0] == 'create site ' ~ wsfc_cluster_test_site1
          - wsfc_cluster_sites_check.actions[1] == 'create site ' ~ wsfc_cluster_test_site2
          - wsfc_cluster_sites_check.actions[2] == 'move node ' ~ wsfc_cluster_host ~ ' from no site to site ' ~ wsfc_cluster_test_site1
          - wsfc_cluster_sites_check.actions[3] is search("^set the cluster's preferred site from '.*' to '" ~ wsfc_cluster_test_site1 ~ "'$")
          - wsfc_cluster_sites_check.diff.prepared.splitlines() == wsfc_cluster_sites_check.actions
          - wsfc_cluster_read_sites_check.result == wsfc_cluster_read_converged.result
        fail_msg: "{{ wsfc_cluster_sites_check }} / {{ wsfc_cluster_read_sites_check.result }}"

    - name: Create the sites, place the node and prefer the first site
      git_cgallagher.windows.wsfc_cluster: *wsfc_cluster_sites_args
      diff: true
      register: wsfc_cluster_sites

    - name: Read the cluster after the sites
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_sites

    # The cmdlets' reference doesn't document the objects they return, so
    # put them in the log: every property with its value and type.
    - name: Read the fault domains and the preferred site as the cmdlets return them
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          Import-Module -Name FailoverClusters
          foreach ($d in @(Get-ClusterFaultDomain)) {
              @($d.PSObject.Properties | ForEach-Object { '{0}={1} [{2}]' -f $_.Name, (@($_.Value) -join ','), $_.TypeNameOfValue }) -join '; '
          }
          $preferred = (Get-Cluster -Name $env:COMPUTERNAME).PreferredSite
          if ($null -eq $preferred) { 'PreferredSite is null' }
          else { 'PreferredSite={0} [{1}]' -f $preferred, $preferred.GetType().FullName }
      register: wsfc_cluster_fault_domains

    - name: Show them
      ansible.builtin.debug:
        var: wsfc_cluster_fault_domains.output

    - name: Check the sites, the node's site, the preferred site and the vote
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites is changed
          - wsfc_cluster_sites.actions == wsfc_cluster_sites_check.actions
          - wsfc_cluster_read_sites.result.sites | map(attribute='name') | sort == [wsfc_cluster_test_site1, wsfc_cluster_test_site2]
          - wsfc_cluster_site1.description == 'Test site one'
          - wsfc_cluster_site1.nodes | map('regex_replace', '\\..*$', '') | map('upper') | list == [wsfc_cluster_host]
          - wsfc_cluster_site2.nodes == []
          - wsfc_cluster_read_sites.result.preferred_site | upper == wsfc_cluster_test_site1
          - wsfc_cluster_read_sites.result.node_weights == [1]
        fail_msg: "{{ wsfc_cluster_sites }} / {{ wsfc_cluster_read_sites.result }}"
      vars:
        wsfc_cluster_site1: "{{ wsfc_cluster_read_sites.result.sites | selectattr('name', 'equalto', wsfc_cluster_test_site1) | first }}"
        wsfc_cluster_site2: "{{ wsfc_cluster_read_sites.result.sites | selectattr('name', 'equalto', wsfc_cluster_test_site2) | first }}"

    - name: Create the sites again
      git_cgallagher.windows.wsfc_cluster: *wsfc_cluster_sites_args
      register: wsfc_cluster_sites_again

    - name: Check the repeat changed nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites_again is not changed
          - wsfc_cluster_sites_again.actions == []
        fail_msg: "{{ wsfc_cluster_sites_again | string }}"

    - name: List only the first site
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        sites: "{{ wsfc_cluster_test_sites[:1] }}"
      register: wsfc_cluster_sites_partial

    - name: Check the unlisted site was reported and left in place
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites_partial is not changed
          - wsfc_cluster_sites_partial.warnings | select('search', 'Site ' ~ wsfc_cluster_test_site2 ~ " isn't in sites") | list | length == 1
        fail_msg: "{{ wsfc_cluster_sites_partial | string }}"

    - name: Drift a site's description, the node's site and the preferred site out-of-band
      ansible.windows.win_powershell:
        script: |
          param([string]$Site1, [string]$Site2)
          $ErrorActionPreference = 'Stop'
          Import-Module -Name FailoverClusters
          Set-ClusterFaultDomain -Name $Site1 -Description 'Drifted'
          # The node's own fault domain, whichever form its name takes.
          $node = @(Get-ClusterFaultDomain -Type Node | Where-Object { ($_.Name -split '\.')[0] -eq $env:COMPUTERNAME })
          if ($node.Count -ne 1) { throw "Found $($node.Count) node fault domains for $env:COMPUTERNAME" }
          Set-ClusterFaultDomain -Name $node[0].Name -FaultDomain $Site2
          $cluster = Get-Cluster -Name $env:COMPUTERNAME
          $cluster.PreferredSite = $Site2
        parameters:
          Site1: "{{ wsfc_cluster_test_site1 }}"
          Site2: "{{ wsfc_cluster_test_site2 }}"

    - name: Plan the site fixes (check mode)
      git_cgallagher.windows.wsfc_cluster: *wsfc_cluster_sites_args
      check_mode: true
      register: wsfc_cluster_sites_drift_check

    - name: Read the cluster after the plan
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_sites_drifted

    - name: Check the plan has exactly the three fixes and the drift is still there
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites_drift_check is changed
          - >-
            wsfc_cluster_sites_drift_check.actions == [
              "set site " ~ wsfc_cluster_test_site1 ~ "'s description from 'Drifted' to 'Test site one'",
              "move node " ~ wsfc_cluster_host ~ " from " ~ wsfc_cluster_test_site2 ~ " to site " ~ wsfc_cluster_test_site1,
              "set the cluster's preferred site from '" ~ wsfc_cluster_test_site2 ~ "' to '" ~ wsfc_cluster_test_site1 ~ "'"]
          - wsfc_cluster_read_sites_drifted.result.preferred_site | upper == wsfc_cluster_test_site2
          - wsfc_cluster_read_sites_drifted.result != wsfc_cluster_read_sites.result
        fail_msg: "{{ wsfc_cluster_sites_drift_check }} / {{ wsfc_cluster_read_sites_drifted.result }}"

    - name: Fix the site drift
      git_cgallagher.windows.wsfc_cluster: *wsfc_cluster_sites_args
      register: wsfc_cluster_sites_drift_fix

    - name: Read the cluster after the site fixes
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_sites_fixed

    - name: Check the site drift was fixed, and only that
      ansible.builtin.assert:
        that:
          - wsfc_cluster_sites_drift_fix is changed
          - wsfc_cluster_sites_drift_fix.actions == wsfc_cluster_sites_drift_check.actions
          - wsfc_cluster_read_sites_fixed.result == wsfc_cluster_read_sites.result
        fail_msg: "{{ wsfc_cluster_sites_drift_fix }} / {{ wsfc_cluster_read_sites_fixed.result }}"

    - name: Name a preferred site that doesn't exist
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        preferred_site: WSFCNOSUCHSITE
      register: wsfc_cluster_bad_preferred
      failed_when: >-
        "isn't one of the sites or an existing site" not in (wsfc_cluster_bad_preferred.msg | default(''))

    - name: Put the node in two sites
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        sites:
          - {name: "{{ wsfc_cluster_test_site1 }}", nodes: ["{{ ansible_facts.hostname }}"]}
          - {name: "{{ wsfc_cluster_test_site2 }}", nodes: ["{{ ansible_facts.hostname }}"]}
      register: wsfc_cluster_two_sites
      failed_when: "'a node belongs to one site' not in (wsfc_cluster_two_sites.msg | default(''))"

    - name: Set the preferred site two ways
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        preferred_site: "{{ wsfc_cluster_test_site1 }}"
        properties:
          PreferredSite: "{{ wsfc_cluster_test_site1 }}"
      register: wsfc_cluster_preferred_twice
      failed_when: "'not both' not in (wsfc_cluster_preferred_twice.msg | default(''))"

    - name: Give a vote to a node outside the cluster
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        node_weights:
          WSFCNOSUCHNODE: 0
      register: wsfc_cluster_bad_weight_node
      failed_when: >-
        "in node_weights isn't in the cluster" not in (wsfc_cluster_bad_weight_node.msg | default(''))

    - name: Give the node a weight of 2
      git_cgallagher.windows.wsfc_cluster:
        name: "{{ setup_wsfc_name }}"
        nodes: ["{{ ansible_facts.hostname }}"]
        administrative_access_point: None
        validate: false
        node_weights: "{{ {ansible_facts.hostname: 2} }}"
      register: wsfc_cluster_bad_weight
      failed_when: "'must be 0 or 1' not in (wsfc_cluster_bad_weight.msg | default(''))"

    - name: Read the cluster after the site failures
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_read_script }}"
        depth: 5
      register: wsfc_cluster_read_after_site_errors

    - name: Check the site failures changed nothing
      ansible.builtin.assert:
        that:
          - wsfc_cluster_bad_preferred is not changed
          - wsfc_cluster_two_sites is not changed
          - wsfc_cluster_preferred_twice is not changed
          - wsfc_cluster_bad_weight_node is not changed
          - wsfc_cluster_bad_weight is not changed
          - wsfc_cluster_read_after_site_errors.result == wsfc_cluster_read_sites.result
        fail_msg: "{{ wsfc_cluster_read_after_site_errors.result | string }}"
  always:
    - name: Remove the test cluster
      ansible.windows.win_powershell:
        script: "{{ setup_wsfc_remove_script }}"
      register: wsfc_cluster_cleanup

- name: Read the cluster after the cleanup
  ansible.windows.win_powershell:
    script: "{{ setup_wsfc_read_script }}"
    depth: 5
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ ansible_user }}"
  vars:
    ansible_become_password: "{{ ansible_password }}"
  register: wsfc_cluster_read_final

- name: Check the tests left no cluster behind
  ansible.builtin.assert:
    that: not wsfc_cluster_read_final.result.exists
    fail_msg: "{{ wsfc_cluster_read_final.result | string }}"

---
# Installs IIS and creates the test website and application. Idempotent, so
# every target can depend on it (meta/main.yml) and the Molecule scenario's
# prepare step can run it first, then again to check that nothing changes.
# Every task registers a setup_iis_* result for that second-run check.
- name: Install IIS, its management tools and the WebAdministration module
  ansible.windows.win_feature:
    name:
      - Web-Server
      - Web-Scripting-Tools
    include_management_tools: true
    state: present
  register: setup_iis_feature

- name: Reboot when the install asks for it
  ansible.windows.win_reboot:
  when: setup_iis_feature.reboot_required

- name: Create the test website's and application's directories
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ setup_iis_site_dir }}"
    - "{{ setup_iis_application_dir }}"
  register: setup_iis_dirs

# community.windows' IIS modules are a test dependency only
# (tests/integration/requirements.yml), not one of the collection's.
- name: Create the test website
  community.windows.win_iis_website:
    name: "{{ setup_iis_site }}"
    port: "{{ setup_iis_site_port }}"
    physical_path: "{{ setup_iis_site_dir }}"
    state: started
  register: setup_iis_website

# IIS names the application without the leading slash its path carries.
- name: Create the test application
  community.windows.win_iis_webapplication:
    site: "{{ setup_iis_site }}"
    name: "{{ setup_iis_application | regex_replace('^/', '') }}"
    physical_path: "{{ setup_iis_application_dir }}"
    application_pool: DefaultAppPool
    state: present
  register: setup_iis_application_result

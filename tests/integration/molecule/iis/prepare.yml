---
# A plain server, never promoted. Quiet it, check that the modules fail
# clearly while IIS is missing, then install IIS and create the test website
# with the setup_iis target, which the targets also depend on.
- name: Prepare the IIS lab VM
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for the connection
      ansible.builtin.wait_for_connection:
        timeout: 600

    # The shared step from the molecule collection (ad_forest includes it
    # itself, so the domain labs don't).
    - name: Quiet the VM (Windows Update off, Defender real-time scanning off)
      ansible.builtin.include_role:
        name: git_cgallagher.molecule.quiet_vm

    - name: Look for IIS
      ansible.windows.win_service_info:
        name: W3SVC
      register: lab_iis_service

    - name: Read the MIME map before IIS is installed
      git_cgallagher.windows.iis_mime_type_info:
      register: lab_no_iis
      failed_when: "'Install the Web-Server feature' not in (lab_no_iis.msg | default(''))"
      when: not lab_iis_service.exists

    - name: Install IIS and create the test website
      ansible.builtin.include_role:
        name: setup_iis

    # The targets depend on setup_iis, so it runs again under converge; it
    # must change nothing then. The scenario has no idempotence step (the
    # targets change mappings on purpose), so check the second run here, on
    # the results setup_iis registers.
    - name: Run setup_iis again (nothing to do)
      ansible.builtin.include_role:
        name: setup_iis

    - name: Check the second setup_iis run changed nothing
      ansible.builtin.assert:
        that:
          - not setup_iis_feature.changed
          - not setup_iis_feature.reboot_required
          - not setup_iis_dirs.changed
          - not setup_iis_website.changed
          - not setup_iis_application_result.changed
        fail_msg: >-
          The second setup_iis run reported changes:
          feature {{ setup_iis_feature.changed }}, directories {{ setup_iis_dirs.changed }},
          website {{ setup_iis_website.changed }}, application {{ setup_iis_application_result.changed }}

---
# Shared by the GPO roles' prepare.yml (ansible.builtin.import_playbook).
#
# git_cgallagher.molecule's ad_forest role does the promotion. The box's local
# accounts become domain accounts when it's promoted to the first DC of a new
# forest, so the connection keeps working as `vagrant` (PSRP + NTLM, which
# unlike Basic auth works for domain accounts).
- name: Promote the VM to the first DC of a new forest
  hosts: all
  gather_facts: false
  tasks:
    # Waits for the connection, quiets the VM (Windows Update off, Defender
    # real-time scanning off), points DNS at itself, promotes, reboots, then
    # joins the connection account to the admin groups and reconnects so the
    # new membership is in its logon token.
    - name: Promote
      ansible.builtin.include_role:
        name: git_cgallagher.molecule.ad_forest
      vars:
        ad_forest_domain: "{{ lab_domain }}"
        ad_forest_netbios: "{{ lab_netbios }}"
        ad_forest_dsrm_password: "{{ lab_dsrm_password }}"
        # GPMC + AD PowerShell up front so the post-reboot readiness check can use them.
        ad_forest_features: [AD-Domain-Services, GPMC, RSAT-AD-PowerShell]
        # "Available" means ADWS answers (the AD module), SYSVOL is initialised
        # and shared, and GPMC can enumerate GPOs — not merely "WinRM is up".
        ad_forest_ready_modules: [ActiveDirectory, GroupPolicy]
        ad_forest_ready_test: >-
          $netlogon = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -ErrorAction Stop;
          if ($netlogon.SysvolReady -ne 1) { exit 1 };
          if (-not (Get-SmbShare -Name SYSVOL -ErrorAction SilentlyContinue)) { exit 1 };
          $null = Get-GPO -All -ErrorAction Stop
        # The share being up isn't enough: Group Policy Preferences (and other
        # GPMC writes) go through the *domain's* DFS path, which needs the DFS
        # referral service. Right after promotion that path can still fail with
        # "The network path was not found" (it failed one CI run 6 s after the
        # reboot check passed), so wait until \\domain\SYSVOL resolves too.
        ad_forest_wait_sysvol_path: true
        ad_forest_admin_groups: [Domain Admins, Group Policy Creator Owners]

    - name: Show the domain
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $d = Get-ADDomain
          [ordered]@{
              dns_root = $d.DNSRoot
              pdc      = $d.PDCEmulator
              gpos     = @(Get-GPO -All | ForEach-Object { $_.DisplayName } | Sort-Object)
              os       = (Get-CimInstance -ClassName Win32_OperatingSystem).Caption
          }
      register: lab_domain_info

    - name: Report the domain
      ansible.builtin.debug:
        var: lab_domain_info.output

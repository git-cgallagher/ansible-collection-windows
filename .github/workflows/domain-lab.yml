name: domain-lab

# End-to-end tests against a real Windows Server 2022 domain controller. Each
# role has its own Molecule scenario (roles/<role>/molecule/default); each job
# boots a VM under QEMU/KVM on its runner (the molecule-git-cgallagher driver),
# promotes it to the first DC of a new forest and runs that role's scenario
# against it. The lab the scenarios share is tests/domain_lab/ plus the
# Molecule base config, .config/molecule/config.yml.
# About 14 min, the roles in parallel. wsfc's VM stays a workgroup
# server (a one-node cluster), never a DC. wsfc_fileserver's scenario boots
# three VMs on a lab network (a DC that serves iSCSI disks, two cluster nodes)
# and takes about an hour: it's wsfc's multi-node coverage too.
#
# Not a required check: it is path-filtered (a required check that doesn't run
# blocks merges forever) and depends on a third-party box download. Promote
# the jobs to required after four consecutive green weekly runs (AGENTS.md).

on:
  pull_request:
    paths:
      - roles/**
      - plugins/**
      - tests/domain_lab/**
      - tests/integration/**
      - .config/molecule/**
      - requirements.yml
      - .github/workflows/domain-lab.yml
  push:
    branches: [main]
    paths:
      - roles/**
      - plugins/**
      - tests/domain_lab/**
      - tests/integration/**
      - .config/molecule/**
      - requirements.yml
      - .github/workflows/domain-lab.yml
  # Weekly: catches box, collection and runner-image changes.
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight (about 14 minutes).
concurrency:
  group: domain-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output (retry lines included) instead of buffering it
  # until the play ends; a stalled step is then visible in the live log.
  PYTHONUNBUFFERED: '1'
  # The driver keeps the box (~6 GB, plus ~6 GB while unpacking) and the VM
  # disks here, and the GPO scenarios their exports (lab_dir). On ubuntu-latest
  # /mnt is a directory on the root filesystem, not a disk of its own. The
  # "Make room for the lab" step moves the lab when /mnt is short of room.
  MOLECULE_LAB_DIR: /mnt/gpo-lab

# The IIS modules (plugins/modules/iis_*) are tested the same way by one more
# job: the Molecule scenario tests/integration/molecule/iis boots the same box
# as a plain server (never a DC), installs IIS and runs the modules'
# integration targets (tests/integration/targets/) as roles.
jobs:
  molecule:
    name: molecule (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      # One job's failure must not cancel the others' 14-minute runs.
      fail-fast: false
      # name: the job's name and diagnostics artifact; workdir: the scenario's
      # project directory; vm: the scenario's platform names (space-separated);
      # timeout: minutes for molecule test, when 75 isn't enough.
      matrix:
        include:
          - {name: gpo_backup, workdir: roles/gpo_backup, scenario: default, vm: dc01}
          - {name: gpo_import, workdir: roles/gpo_import, scenario: default, vm: dc01}
          - {name: wsfc, workdir: roles/wsfc, scenario: default, vm: dc01}
          - {name: mssql_prereqs, workdir: roles/mssql_prereqs, scenario: default, vm: dc01}
          - {name: iis, workdir: tests/integration, scenario: iis, vm: iis01}
          - {name: wsfc_fileserver, workdir: roles/wsfc_fileserver, scenario: default, vm: dc01 node1 node2, timeout: 120}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The driver refuses to create a VM with under 20 GB free in the lab
      # directory (its windows_vm create.yml, measured with df -Pk, as here).
      # Most runners have about 85 GB free on / (145 GB, /dev/root), but some
      # come up with a 72 GB root (/dev/mapper/cow-root) and about 16 GB free
      # (issue #62, actions/runner-images#15238). Then this step deletes big
      # preinstalled toolchains the lab never uses (about 25 GB, in a minute)
      # and moves the lab to a directory on /: the same disk as /mnt today, the
      # right one if /mnt is ever a small disk of its own. The later steps read
      # the new path from ${{ env.MOLECULE_LAB_DIR }}. NEED_GB leaves margin
      # over the driver's 20 GB, part of which the image pull, apt and pip
      # below use. The biggest lab, wsfc_fileserver's three VMs, ends at 15 GB
      # (2026-11-05), so the driver's check is what has to pass.
      - name: Make room for the lab
        timeout-minutes: 10
        env:
          NEED_GB: '30'
        run: |
          avail_kb() { df -Pk "$1" | awk 'NR == 2 {print $4}'; }
          gb() { awk -v kb="$1" 'BEGIN {printf "%.1f", kb / 1048576}'; }
          need_kb=$((NEED_GB * 1048576))
          lab=$MOLECULE_LAB_DIR
          df -h / /mnt
          if [ "$(avail_kb /mnt)" -lt "$need_kb" ]; then
            echo "/mnt has $(gb "$(avail_kb /mnt)") GB free, under $NEED_GB GB. Deleting from /:"
            for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /opt/hostedtoolcache/CodeQL /usr/share/swift; do
              [ -e "$dir" ] || continue
              before=$(avail_kb /)
              sudo rm -rf "$dir"
              echo "  $dir ($(gb $(($(avail_kb /) - before))) GB)"
            done
            lab=$HOME/gpo-lab
            echo "MOLECULE_LAB_DIR=$lab" >> "$GITHUB_ENV"
          fi
          # The lab directory doesn't exist yet (setup-molecule creates it).
          free_kb=$(avail_kb "$(dirname "$lab")")
          echo "Lab directory: $lab, on $(df -P "$(dirname "$lab")" | awk 'NR == 2 {print $1}'), $(gb "$free_kb") GB free"
          if [ "$free_kb" -lt "$need_kb" ]; then
            echo "::warning::Only $(gb "$free_kb") GB free for the lab ($lab); it may run out of room. Re-run the job if it does."
          fi

      # Python, ansible-core, Molecule, the molecule-git-cgallagher driver and
      # its collection git_cgallagher.molecule (both from the action's pinned
      # commit), the other collections, the checkout as git_cgallagher.windows
      # in .molecule-collections, KVM, QEMU, pypsrp and the lab directory.
      # Normally a few minutes; a stuck apt hung a run until the 120-minute job
      # limit (2026-11-01), so fail fast and re-run instead. Since v0.2.1 the
      # action limits its own apt-get calls (3 and 8 minutes); this step's
      # limit is the backstop for the rest, because a composite action's own
      # steps can't set one.
      # Python packages and collections at the versions of the ansible-runtime image ansible-test.yml
      # pins: its constraints.txt, and its collections (setup-molecule's collections-image), so the
      # lab runs the same ansible-core, Molecule, pypsrp and collections as the jobs that run in the
      # image, and downloads no collection from Galaxy. .cache/ is gitignored.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ansible-test.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ansible-test.yml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt

      - name: Set up Molecule, the driver, KVM and QEMU
        uses: git-cgallagher/ansible-collection-molecule/.github/actions/setup-molecule@fe241402b3ecf67a343b634d39a14086ef913a50  # v0.5.0
        timeout-minutes: 15
        with:
          constraints: .cache/constraints.txt
          collection: git_cgallagher.windows
          # Every collection in the image except git_cgallagher.molecule (the action's own commit
          # supplies that one), copied, never downloaded.
          collections-image: ${{ steps.runtime.outputs.image }}
          # The files the scenarios' dependency steps name (the IIS one uses tests/integration's),
          # checked offline against the image's collections: one it lacks fails here.
          requirements: |
            tests/domain_lab/requirements.yml
            tests/integration/requirements.yml
          kvm: 'true'
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}

      # From the scenario's project directory (the role's, or
      # tests/integration): that's where Molecule finds the scenario, and how
      # its prerun recognizes a role inside a collection.
      # --destroy=never: keep the VM for the diagnostics below; the last step
      # destroys it either way.
      # A hang must become a failure, so the screen capture below runs.
      - name: molecule test
        timeout-minutes: ${{ matrix.timeout || 75 }}
        working-directory: ${{ matrix.workdir }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$SCENARIO" --destroy=never

      # What the lab used (the box image, each VM's copy-on-write disk) and
      # the room left, before destroy deletes the VM disks. QEMU pauses a VM
      # whose disk runs out of room: the screen capture below then reports
      # "VM status: paused (io-error)".
      - name: Show the lab's disk use
        if: always()
        timeout-minutes: 2
        run: |
          du -sch "$MOLECULE_LAB_DIR"/* || true
          df -h "$MOLECULE_LAB_DIR" || true

      # Writes <vm>-screen.ppm into the lab directory; never fails the job.
      - name: Capture the VM screen
        if: failure()
        timeout-minutes: 2
        uses: git-cgallagher/ansible-collection-molecule/.github/actions/vm-screendump@fe241402b3ecf67a343b634d39a14086ef913a50  # v0.5.0
        with:
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}
          platforms: ${{ matrix.vm }}

      # A VM whose QEMU process vanished leaves no screen to capture; say
      # whether the kernel killed it for memory, and which QEMUs still run.
      - name: Show host memory and OOM kills
        if: failure()
        timeout-minutes: 2
        run: |
          free -m
          ps -o pid,rss,args -C qemu-system-x86_64 || true
          sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: domain-lab-diagnostics-${{ matrix.name }}
          path: |
            ${{ env.MOLECULE_LAB_DIR }}/*-screen.ppm
            ${{ env.MOLECULE_LAB_DIR }}/*-qemu.log
            ${{ env.MOLECULE_LAB_DIR }}/gpo-repo*/
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        working-directory: ${{ matrix.workdir }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: molecule destroy -s "$SCENARIO"

name: domain-lab

# End-to-end tests against a real Windows Server 2022 domain controller. Each
# role has its own Molecule scenario (roles/<role>/molecule/default); each job
# boots a VM under QEMU/KVM on its runner (the molecule-git-cgallagher driver),
# promotes it to the first DC of a new forest and runs that role's scenario
# against it. The lab the scenarios share is tests/domain_lab/ plus the
# Molecule base config, .config/molecule/config.yml.
# About 14 min, the roles in parallel. wsfc's VM stays a workgroup
# server (a one-node cluster), never a DC.
#
# Not a required check: it is path-filtered (a required check that doesn't run
# blocks merges forever) and depends on a third-party box download. Promote
# the jobs to required after four consecutive green weekly runs (AGENTS.md).

on:
  pull_request:
    paths:
      - roles/**
      - plugins/**
      - tests/domain_lab/**
      - tests/integration/**
      - .config/molecule/**
      - requirements.yml
      - .github/workflows/domain-lab.yml
  push:
    branches: [main]
    paths:
      - roles/**
      - plugins/**
      - tests/domain_lab/**
      - tests/integration/**
      - .config/molecule/**
      - requirements.yml
      - .github/workflows/domain-lab.yml
  # Weekly: catches box, collection and runner-image changes.
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight (about 14 minutes).
concurrency:
  group: domain-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output (retry lines included) instead of buffering it
  # until the play ends; a stalled step is then visible in the live log.
  PYTHONUNBUFFERED: '1'
  # The runner's temp disk: the box (~6 GB, plus ~6 GB while unpacking) and
  # the VM disk don't fit on the ~14 GB root filesystem. The driver keeps them
  # here, and the GPO scenarios their exports (lab_dir).
  MOLECULE_LAB_DIR: /mnt/gpo-lab

# The IIS modules (plugins/modules/iis_*) are tested the same way by one more
# job: the Molecule scenario tests/integration/molecule/iis boots the same box
# as a plain server (never a DC), installs IIS and runs the modules'
# integration targets (tests/integration/targets/) as roles.
jobs:
  molecule:
    name: molecule (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One job's failure must not cancel the others' 14-minute runs.
      fail-fast: false
      # name: the job's name and diagnostics artifact; workdir: the scenario's
      # project directory; vm: the scenario's platform name.
      matrix:
        include:
          - {name: gpo_backup, workdir: roles/gpo_backup, scenario: default, vm: dc01}
          - {name: gpo_import, workdir: roles/gpo_import, scenario: default, vm: dc01}
          - {name: wsfc, workdir: roles/wsfc, scenario: default, vm: dc01}
          - {name: iis, workdir: tests/integration, scenario: iis, vm: iis01}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Python, ansible-core, Molecule, the molecule-git-cgallagher driver and
      # its collection git_cgallagher.molecule (both from the action's pinned
      # commit; the collection brings ansible.windows and microsoft.ad), the
      # checkout as git_cgallagher.windows in .molecule-collections, KVM, QEMU,
      # pypsrp and the lab directory.
      # Normally a few minutes; a stuck apt hung a run until the 120-minute job
      # limit (2026-11-01), so fail fast and re-run instead. Since v0.2.1 the
      # action limits its own apt-get calls (3 and 8 minutes); this step's
      # limit is the backstop for the rest, because a composite action's own
      # steps can't set one.
      - name: Set up Molecule, the driver, KVM and QEMU
        uses: git-cgallagher/ansible-collection-molecule/.github/actions/setup-molecule@0a21eb793e3e5b50fe25c06fcbf76a7d202c634f  # v0.2.1
        timeout-minutes: 15
        with:
          collection: git_cgallagher.windows
          requirements: requirements.yml
          kvm: 'true'
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}

      # From the scenario's project directory (the role's, or
      # tests/integration): that's where Molecule finds the scenario, and how
      # its prerun recognizes a role inside a collection.
      # --destroy=never: keep the VM for the diagnostics below; the last step
      # destroys it either way.
      # A hang must become a failure, so the screen capture below runs.
      - name: molecule test
        timeout-minutes: 75
        working-directory: ${{ matrix.workdir }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$SCENARIO" --destroy=never

      # Writes <vm>-screen.ppm into the lab directory; never fails the job.
      - name: Capture the VM screen
        if: failure()
        timeout-minutes: 2
        uses: git-cgallagher/ansible-collection-molecule/.github/actions/vm-screendump@0a21eb793e3e5b50fe25c06fcbf76a7d202c634f  # v0.2.1
        with:
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}
          platforms: ${{ matrix.vm }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: domain-lab-diagnostics-${{ matrix.name }}
          path: |
            ${{ env.MOLECULE_LAB_DIR }}/*-screen.ppm
            ${{ env.MOLECULE_LAB_DIR }}/gpo-repo*/
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        working-directory: ${{ matrix.workdir }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: molecule destroy -s "$SCENARIO"

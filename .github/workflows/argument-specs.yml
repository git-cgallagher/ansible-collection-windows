name: argument-specs

# Validates the roles' meta/argument_specs.yml against the *built and
# installed* collection (so the specs must actually ship): every spec renders
# with ansible-doc, agrees with defaults/main.yml, and makes the roles reject
# bad input before any task touches a host. See tests/argument_specs/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  argument-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PY_COLORS: '1'
      ANSIBLE_FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - run: pip install ansible-core

      - name: Build and install the collection
        run: |
          ansible-galaxy collection build --force --output-path "$RUNNER_TEMP/dist"
          ansible-galaxy collection install "$RUNNER_TEMP"/dist/git_cgallagher-windows-*.tar.gz -p "$RUNNER_TEMP/collections"

      - name: Render each role's documentation from its spec
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          ansible-doc -t role -l git_cgallagher.windows
          for role in gpo_backup gpo_import wsfc wsfc_fileserver; do
            ansible-doc -t role "git_cgallagher.windows.$role" > /dev/null
            echo "ok: git_cgallagher.windows.$role"
          done

      # The modules document themselves in YAML files next to them; rendering
      # them from the installed tarball proves those files ship.
      - name: Render each module's documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          ansible-doc -t module -l git_cgallagher.windows
          for module in iis_mime_type iis_mime_type_info wsfc_cluster; do
            ansible-doc -t module "git_cgallagher.windows.$module" > /dev/null
            echo "ok: git_cgallagher.windows.$module"
          done

      - name: Check specs against defaults and exercise validation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: ansible-playbook tests/argument_specs/validate.yml

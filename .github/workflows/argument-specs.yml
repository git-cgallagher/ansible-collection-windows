name: argument-specs

# Validates the roles' meta/argument_specs.yml against the *built and
# installed* collection (so the specs must actually ship): every spec renders
# with ansible-doc, agrees with defaults/main.yml, and makes the roles reject
# bad input before any task touches a host. See tests/argument_specs/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  argument-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PY_COLORS: '1'
      ANSIBLE_FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The ansible-runtime image ansible-test.yml pins: ansible-core and ansible.windows
      # at its versions. One container, so /tmp/dist and /tmp/colls live only inside it.
      # --no-deps: ansible.windows comes from the image (site-packages, always on the
      # search path), not a fresh Galaxy download.
      - name: Use the ansible-runtime image ansible-test.yml pins
        run: |
          echo "RUNTIME_IMAGE=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ansible-test.yml)" >> "$GITHUB_ENV"

      - name: Build, install, render the docs and exercise the specs
        run: |
          .github/ci/runtime.sh bash -euo pipefail -c '
            ansible-galaxy collection build --force --output-path /tmp/dist
            ansible-galaxy collection install --no-deps /tmp/dist/git_cgallagher-windows-*.tar.gz -p /tmp/colls
            export ANSIBLE_COLLECTIONS_PATH=/tmp/colls

            # the documentation of each role, from its spec
            ansible-doc -t role -l git_cgallagher.windows
            for role in gpo_backup gpo_import wsfc; do
              ansible-doc -t role "git_cgallagher.windows.$role" > /dev/null
              echo "ok: git_cgallagher.windows.$role"
            done

            # the modules document themselves in YAML files next to them; rendering
            # them from the installed tarball proves those files ship
            ansible-doc -t module -l git_cgallagher.windows
            for module in iis_mime_type iis_mime_type_info wsfc_cluster; do
              ansible-doc -t module "git_cgallagher.windows.$module" > /dev/null
              echo "ok: git_cgallagher.windows.$module"
            done

            # specs against defaults, and validation
            ansible-playbook tests/argument_specs/validate.yml'

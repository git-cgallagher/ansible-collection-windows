name: ansible-test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly health check against new stable ansible-core point releases.
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# lint runs in the ansible-runtime image (.github/ci/runtime.sh): pinned ansible-core,
# ansible-lint, yamllint and the third-party collections (ansible.windows, microsoft.ad)
# the roles and the domain lab use, so it installs nothing. Bump the tag AND digest
# together, to an ansible-runtime release. sanity and domain-lab install their own.
env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  RUNTIME_IMAGE: ghcr.io/git-cgallagher/ansible-runtime:0.2.1-ci@sha256:fa62b5e75f327ebe756b76af2af643e30a90314d7a787e389f1ad5ee7f2c24ea

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  # Every merge to main is releasable (release.yml), so a PR that changes
  # anything shipped in the collection must bump galaxy.yml's version and add
  # a CHANGELOG entry. Galaxy versions can't be re-uploaded.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version bump for shipped changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Paths that are NOT in the tarball (galaxy.yml build_ignore).
          ignore='^(\.github/|\.config/|roles/[^/]+/molecule/|tests/|AGENTS\.md$|\.ansible-lint(-ignore)?$|\.yamllint$|\.gitignore$)'
          shipped=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$ignore" || true)
          if [ -z "$shipped" ]; then echo "No shipped files changed; no release needed."; exit 0; fi
          echo "Shipped files changed:"; echo "$shipped" | sed 's/^/  /'
          ver() { python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["version"])'; }
          # The base of the very first PR has no galaxy.yml yet.
          if git cat-file -e "$BASE:galaxy.yml" 2>/dev/null; then
            old=$(git show "$BASE:galaxy.yml" | ver)
          else
            old=0.0.0
          fi
          new=$(ver < galaxy.yml)
          if [ "$old" = "$new" ]; then
            echo "::error file=galaxy.yml::Shipped content changed but version is still $old. Bump galaxy.yml (semver) and add a CHANGELOG.md entry."
            exit 1
          fi
          python3 - "$old" "$new" <<'PY'
          import sys
          o, n = (tuple(int(x) for x in v.split('.')) for v in sys.argv[1:3])
          sys.exit(0 if n > o else f"::error file=galaxy.yml::Version must increase ({sys.argv[1]} -> {sys.argv[2]})")
          PY
          grep -Eq "^## $new( |$)" CHANGELOG.md || { echo "::error file=CHANGELOG.md::No '## $new' entry"; exit 1; }
          echo "OK: $old -> $new"

  sanity:
    name: sanity (${{ matrix.ansible-core-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ansible-core-version: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: sanity

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/ci/runtime.sh yamllint .
      - run: .github/ci/runtime.sh ansible-lint

  powershell:
    # The roles' and modules' PowerShell runs on Windows hosts CI doesn't
    # have, so at minimum: parse every script and module util (a syntax error
    # must not ship green) and gate on PSScriptAnalyzer errors; warnings are
    # printed for review.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Parse scripts and run PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = Get-ChildItem roles, tests, plugins -Recurse -Include '*.ps1', '*.psm1'
          if (-not $files) { throw 'No PowerShell scripts found; did the layout change?' }
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($e in @($parseErrors)) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = 'roles', 'tests', 'plugins' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning, Error }
          $findings | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
          if ($findings | Where-Object Severity -eq 'Error') { exit 1 }

  hygiene:
    # GPO backups are XML; a committed backup fixture carrying a GPP
    # cpassword (a decryptable secret) must never ship.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Only a non-empty value is a secret: GPP writes cpassword="" on items
      # that set no password.
      - name: Refuse a GPP cpassword in any committed XML
        run: |
          hits=$(grep -RiIlE --include='*.xml' 'cpassword="[^"]+"' . || true)
          if [ -n "$hits" ]; then
            echo "::error::cpassword found in: $hits"
            exit 1
          fi
          echo "No cpassword in committed XML."
